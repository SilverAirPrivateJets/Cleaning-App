<style>
:root{
  /* Silver Air brand: Orange #FD9600, Light Gray 1 #A2A4A3, Light Grey 2 #CECFCB, Cyan #009CDD */
  --brand-orange:#FD9600; --brand-gray:#A2A4A3; --brand-grey2:#CECFCB; --brand-cyan:#009CDD;
  --bg:#F3F3F1; --surface:#FFFFFF; --surface-2:#E9E9E6; --surface-3:#F8F8F6;
  --ink:#121314; --ink-2:#55585A; --ink-3:#77797A; --line:#CECFCB; --line-2:#E4E4E1;
  --accent:#FD9600; --accent-ink:#121314; --accent-soft:#FFF1DC; --focus:#121314;
  --link:#00729F;
  --bar:#0B0B0C; --bar-ink:#FFFFFF; --bar-ink-2:#A2A4A3;
  --placard:#121314; --placard-ink:#FFFFFF;
  --s-req:#8F5400; --s-req-bg:#FFEBCC;
  --s-acc:#00699A; --s-acc-bg:#DDF1FA;
  --s-wip:#0A6A7A; --s-wip-bg:#D5EEF2;
  --s-done:#1B6E38; --s-done-bg:#D8EFDF;
  --s-inv:#4A4C4E; --s-inv-bg:#E6E6E3;
  --s-bad:#A8281C; --s-bad-bg:#F9DEDA;
  --s-off:#6B6D6E; --s-off-bg:#ECECEA;
  --shadow:0 10px 30px rgba(18,19,20,.14), 0 2px 6px rgba(18,19,20,.08);
  --f-display:"Zodiak",Georgia,"Times New Roman",serif;
  --f-body:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --f-mono:"Suisse Intl Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E0F10; --surface:#17191A; --surface-2:#222425; --surface-3:#1C1E1F;
    --ink:#ECECEA; --ink-2:#A9ABAC; --ink-3:#848687; --line:#2F3233; --line-2:#26292A;
    --accent:#FD9600; --accent-ink:#121314; --accent-soft:#3A2708; --focus:#FD9600;
    --link:#4FC3F2;
    --bar:#000000; --bar-ink:#FFFFFF; --bar-ink-2:#A2A4A3;
    --placard:#ECECEA; --placard-ink:#121314;
    --s-req:#FDB24D; --s-req-bg:#3A2708;
    --s-acc:#5CC6F2; --s-acc-bg:#0B2F40;
    --s-wip:#5CC9D8; --s-wip-bg:#0F3239;
    --s-done:#6ED18E; --s-done-bg:#12321E;
    --s-inv:#C9CBCC; --s-inv-bg:#2A2C2D;
    --s-bad:#FF8A7D; --s-bad-bg:#3E1A16;
    --s-off:#A0A2A3; --s-off-bg:#262829;
    --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0F10; --surface:#17191A; --surface-2:#222425; --surface-3:#1C1E1F;
  --ink:#ECECEA; --ink-2:#A9ABAC; --ink-3:#848687; --line:#2F3233; --line-2:#26292A;
  --accent:#FD9600; --accent-ink:#121314; --accent-soft:#3A2708; --focus:#FD9600;
  --link:#4FC3F2;
  --bar:#000000; --bar-ink:#FFFFFF; --bar-ink-2:#A2A4A3;
  --placard:#ECECEA; --placard-ink:#121314;
  --s-req:#FDB24D; --s-req-bg:#3A2708;
  --s-acc:#5CC6F2; --s-acc-bg:#0B2F40;
  --s-wip:#5CC9D8; --s-wip-bg:#0F3239;
  --s-done:#6ED18E; --s-done-bg:#12321E;
  --s-inv:#C9CBCC; --s-inv-bg:#2A2C2D;
  --s-bad:#FF8A7D; --s-bad-bg:#3E1A16;
  --s-off:#A0A2A3; --s-off-bg:#262829;
  --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:0;text-wrap:balance;margin:0}
h1{font-size:34px;line-height:1.1}
h2{font-size:22px}
h3{font-size:17px;font-weight:500}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.mono{font-family:var(--f-mono)}
.label{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:500}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--brand-orange)}
.top-in{max-width:1240px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:20px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap;color:var(--bar-ink)}
.brand .logo{display:block;height:30px;width:auto}
.brand .logo svg{height:30px;width:auto;display:block}
.brand small{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--bar-ink-2);letter-spacing:.08em;text-transform:uppercase;border-left:1px solid #3A3C3D;padding-left:12px}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.nav button{background:none;border:0;padding:20px 12px 17px;cursor:pointer;color:var(--bar-ink-2);font-family:var(--f-mono);font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.nav button[aria-current="page"]{color:var(--bar-ink);border-bottom-color:var(--brand-orange)}
.nav button:hover{color:var(--bar-ink)}
.badge{background:var(--s-bad);color:var(--surface);border-radius:999px;font-size:11px;padding:0 6px;line-height:17px;font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--bar-ink-2);white-space:nowrap}
.who img{width:26px;height:26px;border-radius:50%}
.who b{color:var(--bar-ink);font-weight:600}
@media (max-width:720px){
  .top-in{gap:0 12px;padding-top:10px}
  .nav{order:3;flex-basis:100%;margin-inline:-8px}
  .nav button{padding:10px 8px 11px}
  .brand .logo, .brand .logo svg{height:24px}
  .brand small{display:none}
  .who span.role{display:none}
}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.viewas select{min-height:32px;padding:4px 8px;font-size:13px;width:auto;max-width:200px}
.banner.preview{background:var(--accent-soft);border-color:var(--accent);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.track{display:flex;flex-direction:column;gap:4px;font-size:13.5px;border-top:1px solid var(--line-2);padding-top:10px}
.drawer .track{border-top:0;padding-top:0}
.trk{font-weight:600;display:inline-flex;align-items:center;gap:6px}
.trk::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.trk.air{color:var(--s-wip)} .trk.gnd{color:var(--s-done)} .trk.off{color:var(--ink-3)}
.tlinks{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.tlinks a{color:var(--link);text-decoration:none;font-weight:600}
.tlinks a:hover{text-decoration:underline}
.banner{background:var(--s-req-bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}

/* Buttons & form */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 15px;font-family:var(--f-mono);font-size:13px;font-weight:500;letter-spacing:.03em;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--s-bad);border-color:color-mix(in srgb,var(--s-bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.03em;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:38px}
textarea.input{resize:vertical;min-height:70px}
.input:focus{border-color:var(--brand-orange);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--surface);font-size:14px}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.check input{accent-color:var(--accent);margin:0}
.err{color:var(--s-bad);font-size:13px;font-weight:600}

/* Page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph p{margin:4px 0 0}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;display:flex;gap:6px;align-items:center}
.chip .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] .n{color:var(--surface);opacity:.75}
.search{flex:1;min-width:180px;max-width:320px;margin-left:auto}

/* Tail placard */
.tail{display:inline-block;font-family:var(--f-mono);font-weight:600;letter-spacing:.06em;background:var(--placard);color:var(--placard-ink);border-radius:3px;padding:1px 7px;font-size:13.5px;line-height:1.5}
.tail.lg{font-size:20px;padding:2px 10px}

/* Status pill */
.st{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 9px;white-space:nowrap;line-height:1.6}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-requested{color:var(--s-req);background:var(--s-req-bg)}
.st-accepted{color:var(--s-acc);background:var(--s-acc-bg)}
.st-in_progress{color:var(--s-wip);background:var(--s-wip-bg)}
.st-completed{color:var(--s-done);background:var(--s-done-bg)}
.st-invoiced{color:var(--s-inv);background:var(--s-inv-bg)}
.st-declined{color:var(--s-bad);background:var(--s-bad-bg)}
.st-cancelled{color:var(--s-off);background:var(--s-off-bg)}
.flag{font-size:11.5px;font-weight:700;color:var(--s-bad);text-transform:uppercase;letter-spacing:.05em}

/* Job list */
.day{margin-top:22px}
.day:first-child{margin-top:0}
.day h3{font-family:var(--f-mono);font-weight:500;font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.day h3 .muted{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.job{display:grid;grid-template-columns:118px 92px minmax(0,1.3fr) minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,.9fr);gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-2);padding:12px 16px;cursor:pointer}
.job:first-child{border-top:0}
.job:hover{background:var(--surface-3)}
.job .ac{font-weight:600;min-width:0}
.job .ac small{display:block;font-weight:400;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .when{font-size:13.5px;font-variant-numeric:tabular-nums;min-width:0}
.job .when small{display:block;color:var(--ink-2)}
.job .svc{font-size:13.5px;color:var(--ink-2);min-width:0}
.job .ven{font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .ven.none{color:var(--s-bad)}
@media (max-width:900px){
  .job{grid-template-columns:auto 1fr auto;grid-template-areas:"tail ac st" "when when when" "svc svc ven";gap:4px 12px}
  .job .c-st{grid-area:st}.job .c-tail{grid-area:tail}.job .ac{grid-area:ac}.job .when{grid-area:when}.job .svc{grid-area:svc}.job .ven{grid-area:ven;text-align:right}
  .job .when small{display:inline;margin-left:6px}
}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty h2{color:var(--ink);margin-bottom:6px}

/* Calendar */
.cal-nav{display:flex;gap:8px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.cal .col{border-left:1px solid var(--line-2);min-height:260px;display:flex;flex-direction:column}
.cal .col:first-child{border-left:0}
.cal .dh{padding:8px 10px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--ink-2)}
.cal .dh b{font-family:var(--f-display);font-weight:500;font-size:22px;color:var(--ink);letter-spacing:0}
.cal .col.today .dh{background:var(--accent-soft)}
.cal .col.today .dh b{color:var(--s-req)}
.cal .items{padding:6px;display:flex;flex-direction:column;gap:6px}
.ev{text-align:left;border:1px solid var(--line);border-left:3px solid var(--c,var(--line));background:var(--surface-3);border-radius:4px;padding:6px 8px;cursor:pointer;font-size:12.5px;line-height:1.35}
.ev:hover{background:var(--surface-2)}
.ev .t{font-family:var(--f-mono);font-weight:600;font-size:12.5px}
.ev .m{color:var(--ink-2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:820px){
  .cal{grid-template-columns:1fr}
  .cal .col{border-left:0;border-top:1px solid var(--line-2);min-height:0}
  .cal .col:first-child{border-top:0}
  .cal .items:empty::after{content:"No jobs";color:var(--ink-3);font-size:13px;padding:2px 4px}
}

/* Fleet */
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ac-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ac-card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ac-card .ty{font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.15}
.ac-card .meta{font-size:13px;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.cls{font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:0 6px}
.ac-card .ft{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

/* Settings */
.sections{display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel > h2{margin-bottom:4px}
.panel > p.muted{margin:0 0 14px;max-width:70ch}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:180px}
.row .person{display:flex;gap:10px;align-items:center;flex:1;min-width:200px}
.row .person img{width:30px;height:30px;border-radius:50%}
.addform{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.addform .field{flex:1;min-width:140px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 11px;font-size:13.5px;background:var(--surface-3)}
.tag button{border:0;background:none;cursor:pointer;color:var(--ink-3);border-radius:50%;width:22px;height:22px;line-height:1}
.tag button:hover{background:var(--surface-2);color:var(--s-bad)}
ol.how{margin:0;padding-left:20px;display:grid;gap:6px;max-width:75ch}

/* Gate */
.gate{max-width:540px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand-orange);border-radius:var(--r);padding:28px;display:grid;gap:16px}
.gate .gate-logo{color:var(--brand-gray);width:260px;max-width:100%}
.gate .gate-logo svg{width:100%;height:auto;display:block}
.gate .kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.gate h1{font-size:32px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(8,15,24,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-hd{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-hd .t{flex:1;min-width:0}
.dr-hd .ty{font-family:var(--f-display);font-weight:500;font-size:22px;margin-top:6px}
.dr-hd .ref{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.dr-body{overflow-y:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:20px}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stepper div{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding-top:8px;border-top:3px solid var(--line)}
.stepper div.on{color:var(--ink);border-top-color:var(--brand-orange)}
.stepper div.now{color:var(--s-req)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.facts div{min-width:0}
.facts b{display:block;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.svcs{display:flex;gap:6px;flex-wrap:wrap}
.svcs span{background:var(--surface-2);border-radius:4px;padding:3px 9px;font-size:13.5px;font-weight:500}
.note{background:var(--surface-3);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actbox{border:1px solid var(--brand-orange);border-left-width:4px;background:var(--accent-soft);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos button{padding:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;aspect-ratio:1;background:var(--surface-2);cursor:zoom-in;max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.ph-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.feed{display:flex;flex-direction:column;gap:12px}
.fe{display:grid;grid-template-columns:28px 1fr;gap:10px}
.fe img{width:28px;height:28px;border-radius:50%}
.fe .h{font-size:13px;color:var(--ink-2)}
.fe .h b{color:var(--ink)}
.fe .x{overflow-wrap:anywhere;white-space:pre-wrap}
.fe.sys .x{color:var(--ink-2);font-size:14px}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal .box{position:relative;background:var(--surface);border-radius:8px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:22px;display:grid;gap:16px}
.modal .box.wide{width:min(1000px,100%);padding:10px}
.modal .box.wide img{width:100%;height:auto;border-radius:4px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

const STATUS = {
  requested:{label:'Requested'}, accepted:{label:'Accepted'}, in_progress:{label:'In progress'},

function lsSet(k,v){ try{ v==null ? localStorage.removeItem('sacd.'+k) : localStorage.setItem('sacd.'+k,v); }catch(e){} }
function readCode(){ try{ return sessionStorage.getItem('sacd.code') || localStorage.getItem('sacd.code'); }catch(e){ return null; } }
function remembered(){ try{ return !!localStorage.getItem('sacd.code'); }catch(e){ return false; } }
function saveCode(code, remember){
  try{
    if(remember){ localStorage.setItem('sacd.code', code); sessionStorage.removeItem('sacd.code'); }
    else { sessionStorage.setItem('sacd.code', code); localStorage.removeItem('sacd.code'); }
  }catch(e){}

/* ---------- utils ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x; }
function pd(s){ if(!s) return null; const d=new Date(s); return isNaN(d)?null:d; }
function dayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fDate(d){ return WD[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]; }
function fTime(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fDT(s){ const d=pd(s); return d? fDate(d)+' · '+fTime(d) : '—'; }
function sameDay(a,b){ return a&&b&&dayKey(a)===dayKey(b); }
function dayLabel(d){ const t=new Date(); t.setHours(0,0,0,0); const diff=Math.round((new Date(d).setHours(0,0,0,0)-t)/864e5);
  if(diff===0) return 'Today'; if(diff===1) return 'Tomorrow'; if(diff===-1) return 'Yesterday'; return fDate(d); }
function ago(iso){ const d=pd(iso); if(!d) return ''; const m=Math.round((Date.now()-d)/6e4);
  if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<24) return h+' h ago'; return fDate(d)+' '+fTime(d); }
function money(n){ if(n===''||n==null||isNaN(+n)) return ''; return '$'+(+n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function toLocalInput(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || ('v'+Date.now().toString(36)); }
function makeRef(){ const d=new Date(); const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r=''; for(let i=0;i<4;i++) r+=c[Math.floor(Math.random()*c.length)];
  return 'SA-'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+r; }
function toast(msg){ const h=$('#toastHost'); h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>'; clearTimeout(toast.t); toast.t=setTimeout(()=>h.innerHTML='',3600); }
function avatar(name){ const i=String(name||'?').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?'; return '<span class="av" aria-hidden="true">'+esc(i)+'</span>'; }

const isVendor = () => S.role==='vendor';

function aircraft(tail){ return S.fleet.find(a=>a.tail===tail); }

}
function isOverdue(j){ const d=pd(j.due); return d && d<new Date() && ['requested','accepted','in_progress','declined'].includes(j.status); }

/* ---------- server ---------- */
async function rpc(fn, args){
  if(!sb){ const e=new Error('no client'); e.code='no_client'; throw e; }
  let res;
  try{ res = await sb.rpc(fn, Object.assign({p_code:S.code}, args||{})); }
  catch(x){ const e=new Error(String(x&&x.message||x)); e.code='network'; throw e; }
  const {data, error} = res;
  if(error){
    const m = String(error.message||'');
    const e = new Error(m);
    e.code = /^[a-z_]+$/.test(m) ? m : (error.code==='PGRST202' || /Could not find the function/i.test(m)) ? 'not_setup' : 'failed';
    throw e;
  }
  return data;
}
async function load(){
  const d = await rpc('desk_load');
  S.role = d.role; S.vendorId = d.vendorId || null; S.mustChange = !!d.mustChange;
  S.vendors = d.vendors || []; S.fleet = d.fleet || [];
  const c = d.config || {}; S.config = {services:c.services||[], airports:c.airports||[]};
  S.jobs = d.jobs || []; S.codes = d.codes || [];
  S.ready = true; S.offline = false;
  render();
}
async function refresh(){
  try{ await load(); }
  catch(e){
    if(e.code==='bad_code'){ signOut('Your passcode has changed. Sign in with the new one.'); return; }
    if(S.ready && !S.offline){ S.offline = true; render(); }
  }
}
function loginErrFor(e){
  if(e.code==='bad_code') return 'That passcode didn’t work. Check it and try again.';
  if(e.code==='not_setup') return 'The database isn’t set up yet. Run the setup SQL in Supabase first.';
  return 'Couldn’t reach the server. Check your connection and try again.';
}
async function signIn(code, name, remember){
  S.signing = true; S.loginErr = ''; render();
  S.code = code; S.name = name; lsSet('name', name);
  try{ await load(); saveCode(code, remember); }
  catch(e){ S.code = null; S.role = null; S.ready = false; S.loginErr = loginErrFor(e); }
  S.signing = false; S.fresh = true; render();
}
function signOut(msg){
  clearCode();
  Object.assign(S, {code:null, role:null, vendorId:null, mustChange:false, ready:false, offline:false,
    jobs:[], vendors:[], fleet:[], codes:[], openId:null, action:null, loginErr:msg||'', fresh:true});
  $('#modalHost').innerHTML = '';
  render();
}

/* ---------- rendering helpers ---------- */
function patch(el, html){
  const keep = !S.fresh;
  const saved = {};
  if(keep) el.querySelectorAll('input[id],textarea[id],select[id]').forEach(i=>{ if(i.type==='file') return; saved[i.id] = (i.type==='checkbox'||i.type==='radio') ? {c:i.checked} : {v:i.value}; });
  const a = document.activeElement; const aid = a && el.contains(a) && a.id ? a.id : null;
  let sel=null; try{ if(aid && a.selectionStart!=null) sel=[a.selectionStart,a.selectionEnd]; }catch(e){}
  el.innerHTML = html;
  if(keep){
    for(const id in saved){ const i = el.querySelector('#'+CSS.escape(id)); if(!i) continue; if('c' in saved[id]) i.checked=saved[id].c; else i.value=saved[id].v; }
    if(aid){ const i=el.querySelector('#'+CSS.escape(aid)); if(i){ i.focus({preventScroll:true}); if(sel) try{ i.setSelectionRange(sel[0],sel[1]); }catch(e){} } }
  }
}
function stPill(s){ return '<span class="st st-'+esc(s)+'">'+esc((STATUS[s]||{}).label||s)+'</span>'; }
function tailTag(t,lg){ return '<span class="tail'+(lg?' lg':'')+'">'+esc(t)+'</span>'; }

function render(){
  renderNav(); renderWho();
  if(!sb){
    main.innerHTML = '<div class="empty"><h2>The app couldn’t load</h2><p>Check your internet connection and refresh the page.</p></div>';
    return;
  }
  if(S.booting){ main.innerHTML = '<div class="empty"><span class="spin"></span> Signing you in…</div>'; return; }
  if(!S.role){ patch(main, renderLogin()); renderDrawer(); S.fresh=false; return; }
  if(S.mustChange){ patch(main, renderMustChange()); renderDrawer(); S.fresh=false; return; }
  let html = S.offline ? '<div class="banner">Can’t reach the server right now. You’re seeing the last loaded data, and changes may not save.</div>' : '';
  if(S.view==='settings' && !isAdmin()) S.view='jobs';
  if(S.view==='calendar') html += renderCalendar();
  else if(S.view==='fleet') html += renderFleet();
  else if(S.view==='settings') html += renderSettings();
  else html += renderJobs();
  patch(main, html);
  renderDrawer();
  S.fresh=false;
}

/* ---------- jobs view ---------- */
function filtered(){
  const f = FILTERS.find(x=>x.k===S.filter) || FILTERS[0];
  const q = S.q.trim().toLowerCase();
  return visibleJobs().filter(j=>{
    if(f.st && !f.st.includes(j.status)) return false;
    if(!q) return true;
    const ac=aircraft(j.tail)||{}; const v=vendorById(j.vendorId)||{};
    return [j.tail,j.airport,j.fbo,ac.type,v.name,j.ref,(j.services||[]).join(' ')].join(' ').toLowerCase().includes(q);
  });
}
function renderJobs(){
  const staff = isStaff();
  const vis = visibleJobs();
  const counts = {}; FILTERS.forEach(f=>counts[f.k]= f.st? vis.filter(j=>f.st.includes(j.status)).length : vis.length);
  let h = '<div class="ph"><div><h1>Cleaning jobs</h1><p class="muted">'
    + (staff ? 'Every cleaning requested across the fleet.' : 'Jobs Silver Air has sent to '+esc(orgLabel())+'.')
    + '</p></div>'
    + (staff ? '<button class="btn primary" data-act="new-job">+ New cleaning</button>' : '') + '</div>';
  h += '<div class="tools"><div class="chips">' + FILTERS.map(f=>'<button class="chip" data-act="filter" data-f="'+f.k+'" aria-pressed="'+(S.filter===f.k)+'">'+esc(f.label)+' <span class="n">'+counts[f.k]+'</span></button>').join('') + '</div>'
    + '<input class="input search" id="q" type="search" placeholder="Search tail, airport, vendor" aria-label="Search jobs" value="'+esc(S.q)+'"></div>';
  const list = filtered();
  if(!list.length){
    const none = !vis.length;
    h += '<div class="empty">'+(none
      ? (staff ? '<h2>No cleanings scheduled yet</h2><p>Pick an aircraft, a window and a vendor. The vendor sees it on their board right away.</p><p><button class="btn primary" data-act="new-job">+ New cleaning</button></p>'
               : '<h2>No jobs yet</h2><p>When Silver Air sends '+esc(orgLabel())+' a cleaning, it shows up here.</p>')
      : '<h2>Nothing matches</h2><p>Try a different filter or search.</p>')+'</div>';
    return h;
  }
  const desc = ['completed','invoiced'].includes(S.filter);
  list.sort((a,b)=> (desc?-1:1) * ((pd(a.start)||0)-(pd(b.start)||0)));
  const groups = []; let cur=null;
  for(const j of list){ const d=pd(j.start); const k=d?dayKey(d):'none'; if(!cur||cur.k!==k){ cur={k,d,items:[]}; groups.push(cur);} cur.items.push(j); }
  for(const g of groups){
    h += '<section class="day"><h3>'+(g.d?esc(dayLabel(g.d))+(dayLabel(g.d)!==fDate(g.d)?' <span class="muted">'+esc(fDate(g.d))+'</span>':''):'No date')+'</h3><div class="list">';
    for(const j of g.items) h += jobRow(j);
    h += '</div></section>';
  }
  return h;
}
function jobRow(j){
  const ac = aircraft(j.tail)||{}; const v = vendorById(j.vendorId);
  const s=pd(j.start), d=pd(j.due);
  const when = (s?fTime(s):'—') + ' → ' + (d ? (sameDay(s,d)? fTime(d) : fDate(d)+' '+fTime(d)) : '—');
  return '<button class="job" data-act="open" data-id="'+esc(j.id)+'">'
    + '<span class="c-st">'+stPill(j.status)+'</span>'
    + '<span class="c-tail">'+tailTag(j.tail)+'</span>'
    + '<span class="ac">'+esc(ac.type||'Aircraft')+'<small>'+esc([j.airport,j.fbo].filter(Boolean).join(' · '))+'</small></span>'
    + '<span class="when">'+esc(when)+' <small>'+(isOverdue(j)?'<span class="flag">Overdue</span>':'local time')+'</small></span>'
    + '<span class="svc">'+esc((j.services||[]).join(' · '))+'</span>'
    + '<span class="ven'+(v?'':' none')+'">'+esc(v?v.name:'No vendor')+'</span>'
    + '</button>';
}

/* ---------- photos ---------- */
const photoCache = {}, photoPending = {};
function loadPhotos(root){
  root.querySelectorAll('img[data-pid]:not([src])').forEach(img=>{
    const id = img.dataset.pid;
    if(photoCache[id]){ img.src = photoCache[id]; return; }
    if(photoPending[id]) return;
    photoPending[id] = rpc('desk_photo_get', {p_id:id}).then(d=>{
      photoCache[id] = d;
      document.querySelectorAll('img[data-pid="'+CSS.escape(id)+'"]').forEach(i=>{ i.src = d; });
    }).catch(()=>{}).finally(()=>{ delete photoPending[id]; });
  });
}

  const host = $('#drawerHost');
  const j = S.role && S.openId && visibleJobs().find(x=>x.id===S.openId);
  if(!j){ if(host.innerHTML) host.innerHTML=''; S.openId=null; return; }
  const ac = aircraft(j.tail)||{}; const v = vendorById(j.vendorId);
  const staff = isStaff(), vend = isVendor();
  const idx = FLOW.indexOf(j.status);
  let h = '<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Job '+esc(j.tail)+'">'
    + '<div class="dr-hd"><div class="t">'+tailTag(j.tail,true)+' '+stPill(j.status)+(isOverdue(j)?' <span class="flag">Overdue</span>':'')
    + '<div class="ty">'+esc(ac.type||'')+(ac.size?' <span class="cls">'+esc(ac.size)+'</span>':'')+'</div><div class="ref">'+esc(j.ref||j.id)+'</div></div>'
    + '<button class="btn ghost" data-act="close" aria-label="Close">✕</button></div><div class="dr-body">';

/* ---------- writes ---------- */
function writeErr(ex){
  const c = ex && ex.code;
  if(c==='bad_code'){ setTimeout(()=>signOut('Your passcode has changed. Sign in with the new one.'),0); return 'Your passcode changed. Signing you out.'; }
  if(c==='not_allowed') return 'Your passcode doesn’t allow that change.';
  if(c==='bad_transition') return 'This job changed since you opened it. Close it and try again.';
  if(c==='not_found') return 'This job no longer exists.';
  if(c==='code_too_short') return 'Codes need at least 6 characters.';
  if(c==='code_in_use') return 'That code is already taken. Pick a different one.';
  if(c==='bad_vendor') return 'Pick a valid vendor.';
  if(c==='bad_tail') return 'Enter a valid N-number, like N123AB.';
  if(c==='photo_too_big') return 'That photo is too large.';
  if(c==='not_setup') return 'The database isn’t set up yet. Run the setup SQL in Supabase.';
  return 'Couldn’t save. Check your connection and try again.';
}
const queues = {};
function serial(key, fn){ const p=(queues[key]||Promise.resolve()).catch(()=>{}).then(fn); queues[key]=p; return p; }
async function updateJob(job, patchData, text, type){
  await serial(job.id, ()=>rpc('desk_job_update', {p_id:job.id, p_patch:patchData||{}, p_type:type||'status', p_text:text||'', p_by:S.name}));
  await refresh();
}
async function doJobAction(j){
  const k=S.action, id=j.id; const val = s=>{ const e=document.getElementById(s+'-'+id); return e?e.value.trim():''; };
  const err=$('#ax-err'); const fail=m=>{ err.textContent=m; err.hidden=false; };
  let p, t;
  switch(k){
    case 'accept': { const q=val('ax-quote'), n=val('ax-note'); p={status:'accepted', acceptedAt:new Date().toISOString()}; if(q) p.quote=+q; t='Accepted the job'+(q?' · quote '+money(q):'')+(n?'. '+n:''); break; }
    case 'decline': { const n=val('ax-note'); if(!n) return fail('Give a reason so Silver Air can rebook.'); p={status:'declined', declineReason:n}; t='Declined: '+n; break; }
    case 'start': { const n=val('ax-note'); p={status:'in_progress', startedAt:new Date().toISOString()}; t='Started work'+(n?'. '+n:''); break; }
    case 'complete': { const n=val('ax-note'); p={status:'completed', completedAt:new Date().toISOString()}; if(n) p.completionNote=n; t='Marked complete'+(n?'. '+n:''); break; }
    case 'invoice': { const inv=val('ax-inv'), amt=val('ax-amt'); if(!inv) return fail('Enter the invoice number.'); if(!amt) return fail('Enter the amount.'); p={status:'invoiced', invoiceNo:inv, invoiceAmount:+amt, invoicedAt:new Date().toISOString()}; t='Invoice #'+inv+' · '+money(amt); break; }
    case 'reassign': { const v=val('ax-v'); if(!v) return fail('Pick a vendor.'); p={vendorId:v, status:'requested', declineReason:''}; t='Sent to '+((vendorById(v)||{}).name||'vendor'); break; }
    case 'cancel': { const n=val('ax-note'); p={status:'cancelled'}; t='Cancelled'+(n?': '+n:''); break; }
    case 'reopen': { p={status:'requested'}; t='Reopened'; break; }
    default: return;
  }
  try{ await updateJob(j, p, t, 'status'); S.action=null; S.fresh=true; toast(k==='reassign'?'Sent':'Updated'); render(); }
  catch(ex){ fail(writeErr(ex)); }
}
function toDataUrl(file){
  return new Promise(res=>{
    if(!/^image\//.test(file.type||'')){ res(null); return; }
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const max=1400; let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,max/Math.max(w,h)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      try{ res(c.toDataURL('image/jpeg',0.72)); }catch(e){ res(null); } };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(null); };
    img.src=url;
  });
}

  const j = S.jobs.find(x=>x.id===S.openId); if(!j||!files.length) return;
  S.uploading=true; renderDrawer();
  let ok=0, failed=0;
  for(const f of files){
    try{
      const url = await toDataUrl(f); if(!url){ failed++; continue; }
      const id = await rpc('desk_photo_add', {p_job:j.id, p_kind:kind, p_data:url, p_by:S.name});
      photoCache[id]=url; ok++;
    }catch(e){ if(e.code==='bad_code'){ writeErr(e); break; } failed++; }
  }
  S.uploading=false;
  await refresh();
  if(failed) toast(failed+' photo'+(failed>1?'s':'')+' couldn’t upload. Try a JPG or PNG.'); else if(ok) toast('Photos added');
  renderDrawer();
}
async function saveConfig(p){ try{ await rpc('desk_config_save', {p_data:{...S.config, ...p}}); await refresh(); return true; }catch(ex){ toast(writeErr(ex)); return false; } }

/* ---------- events ---------- */
document.addEventListener('submit', async e=>{
  const f = e.target;
  if(f.id==='login'){
    e.preventDefault();
    const name=$('#lg-name').value.trim(), code=$('#lg-code').value.trim(), rem=$('#lg-rem').checked;
    const el=$('#lg-err');
    if(!name){ el.textContent='Enter your name so Silver Air knows who made each update.'; el.hidden=false; $('#lg-name').focus(); return; }
    if(!code){ el.textContent='Enter your passcode.'; el.hidden=false; $('#lg-code').focus(); return; }
    await signIn(code, name, rem);
  }
  if(f.id==='mc'){
    e.preventDefault();
    const a=$('#mc-code').value.trim(), b=$('#mc-code2').value.trim(); const el=$('#mc-err');
    if(a.length<6){ el.textContent='Use at least 6 characters.'; el.hidden=false; return; }
    if(a!==b){ el.textContent='The two passcodes don’t match.'; el.hidden=false; return; }
    const btn=f.querySelector('[type=submit]'); btn.disabled=true;
    try{ await rpc('desk_code_set', {p_who:'admin', p_new:a}); const rem=remembered(); S.code=a; saveCode(a, rem); S.fresh=true; await load(); toast('Admin passcode saved'); }
    catch(ex){ el.textContent=writeErr(ex); el.hidden=false; btn.disabled=false; }
  }
});
document.addEventListener('click', async e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(b.tagName==='A') e.preventDefault();
  switch(act){
    case 'view': S.view=b.dataset.v; lsSet('view',S.view); S.fresh=true; render(); window.scrollTo(0,0); break;
    case 'filter': S.filter=b.dataset.f; render(); break;
    case 'wk': { const d=+b.dataset.d; if(d===0) S.week=startOfWeek(new Date()); else { const w=new Date(S.week); w.setDate(w.getDate()+7*d); S.week=w; } render(); break; }
    case 'open': S.openId=b.dataset.id; S.action=null; S.fresh=true; renderDrawer(); S.fresh=false; break;
    case 'close': S.openId=null; S.action=null; renderDrawer(); break;
    case 'signout': signOut(''); break;
    case 'new-job': if(!S.vendors.length){ toast(isAdmin()?'Add a cleaning company in Settings first.':'No vendors set up yet.'); break; } openJobForm(null, b.dataset.tail); break;
    case 'modal-close': closeModal(); break;
    case 'jact': { const k=b.dataset.k;
      if(k==='delete'){ const j=S.jobs.find(x=>x.id===S.openId); if(!j) break;
        confirmBox('Delete '+(j.ref||'this job')+'?', 'This removes the job, its photos and its activity for everyone. It can’t be undone.', 'Delete job', async ()=>{
          await rpc('desk_job_delete', {p_id:j.id}); S.openId=null; S.action=null; toast('Job deleted'); });
        break; }
      if(k==='edit'){ const j=S.jobs.find(x=>x.id===S.openId); if(j) openJobForm(j); break; }
      S.action = (S.action===k? null : (k||null)); S.fresh=true; renderDrawer(); S.fresh=false; const f=$('.actbox input, .actbox select, .actbox textarea'); if(f) f.focus(); break; }
    case 'jdo': { const j=S.jobs.find(x=>x.id===S.openId); if(j){ b.disabled=true; await doJobAction(j); b.disabled=false; } break; }
    case 'comment': { const j=S.jobs.find(x=>x.id===S.openId); if(!j) break; const ta=document.getElementById('cm-'+j.id); const t=ta&&ta.value.trim(); if(!t) break;
      b.disabled=true; try{ await serial(j.id, ()=>rpc('desk_job_update', {p_id:j.id, p_patch:{}, p_type:'comment', p_text:t, p_by:S.name})); const ta2=document.getElementById('cm-'+j.id); if(ta2) ta2.value=''; await refresh(); }catch(ex){ toast(writeErr(ex)); } b.disabled=false; break; }
    case 'photo': { const src=photoCache[b.dataset.pid]; if(!src) break; $('#modalHost').innerHTML='<div class="scrim" data-act="modal-close"></div><div class="modal" data-act="modal-close"><div class="box wide"><img alt="Job photo" src="'+esc(src)+'"></div></div>'; break; }
    case 'copy-link': { const link=appLink(); try{ await navigator.clipboard.writeText(link); toast('Link copied'); }catch(ex){ toast(link); } break; }
    case 'code-set': { const who=b.dataset.who; const inp=document.getElementById(b.dataset.in); const v=inp?inp.value.trim():'';
      if(v.length<6){ toast('Codes need at least 6 characters.'); break; }
      b.disabled=true;
      try{ await rpc('desk_code_set', {p_who:who, p_new:v}); if(inp) inp.value=''; if(who==='admin'){ const rem=remembered(); S.code=v; saveCode(v, rem); } toast('Code saved. Share it with them along with the link.'); await refresh(); }
      catch(ex){ toast(writeErr(ex)); }
      b.disabled=false; break; }
    case 'code-clear': { const who=b.dataset.who, label=b.dataset.label||'this code';
      confirmBox('Turn off the code for '+label+'?', 'Anyone signed in with it is signed out, and it stops working until you create a new one.', 'Turn off code', ()=>rpc('desk_code_clear', {p_who:who})); break; }
    case 'v-add': { const inp=$('#nv-name'); const n=inp.value.trim(); if(!n) break; let id=slug(n); if(vendorById(id)) id+='-'+Date.now().toString(36);
      try{ await rpc('desk_vendor_save', {p_id:id, p_data:{name:n, airports:[]}}); inp.value=''; toast('Added '+n+'. Create a passcode for them above.'); await refresh(); }catch(ex){ toast(writeErr(ex)); } break; }
    case 'v-edit': openVendorForm(b.dataset.id); break;
    case 'v-del': { const id=b.dataset.id; const v=vendorById(id); const open=S.jobs.filter(j=>j.vendorId===id && ['requested','accepted','in_progress'].includes(j.status)).length;
      confirmBox('Remove '+(v?v.name:'company')+'?', (open? 'They still have '+open+' open job'+(open>1?'s':'')+'. Those jobs will show “No vendor” until you reassign them. ' : '')+'Their passcode stops working right away.', 'Remove company', ()=>rpc('desk_vendor_delete', {p_id:id})); break; }
    case 'svc-add': { const inp=$('#ns-name'); const n=inp.value.trim(); if(!n||S.config.services.includes(n)) break; if(await saveConfig({services:[...S.config.services, n]})){ const i2=$('#ns-name'); if(i2) i2.value=''; } break; }
    case 'svc-rm': { const i=+b.dataset.i; await saveConfig({services:S.config.services.filter((_,x)=>x!==i)}); break; }
    case 'apt-add': { const ic=$('#na-icao').value.trim().toUpperCase(); const fbo=$('#na-fbo').value.trim(); if(!/^[A-Z0-9]{3,4}$/.test(ic)){ toast('Enter a 3 or 4 character airport code.'); break; }
      if(await saveConfig({airports:[...S.config.airports.filter(a=>!(a.icao===ic&&a.fbo===fbo)), {icao:ic, fbo}]})){ const a1=$('#na-icao'), a2=$('#na-fbo'); if(a1) a1.value=''; if(a2) a2.value=''; } break; }
    case 'apt-rm': { const i=+b.dataset.i; await saveConfig({airports:S.config.airports.filter((_,x)=>x!==i)}); break; }
    case 'ac-new': openAircraftForm(null); break;
    case 'ac-edit': openAircraftForm(b.dataset.tail); break;
    case 'ac-del': { const t=b.dataset.tail; confirmBox('Remove '+t+'?', 'It disappears from the fleet list. Past jobs for '+t+' stay on record.', 'Remove aircraft', ()=>rpc('desk_fleet_delete', {p_tail:t})); break; }
  }
});
document.addEventListener('input', e=>{ if(e.target.id==='q'){ S.q=e.target.value; render(); } });
document.addEventListener('change', e=>{ const k=e.target.dataset && e.target.dataset.upload; if(k){ const files=[...e.target.files]; e.target.value=''; uploadPhotos(k, files); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('#modalHost').innerHTML) closeModal(); else if(S.openId){ S.openId=null; S.action=null; renderDrawer(); } } });

/* ---------- live updates ---------- */
setInterval(()=>{ if(S.role && S.ready && !S.mustChange && !document.hidden && !S.uploading) refresh(); }, 30000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && S.role && S.ready && !S.mustChange) refresh(); });

/* ---------- boot ---------- */
(async function boot(){
  const c = sb && readCode();
  if(c){
    S.code = c; S.booting = true; render();
    try{ await load(); }
    catch(e){
      if(e.code==='bad_code') clearCode();
      S.code = null; S.role = null; S.ready = false;
      S.loginErr = e.code==='bad_code' ? 'Your passcode has changed. Sign in with the new one.' : loginErrFor(e);
    }
    S.booting = false; S.fresh = true;
  }
  render();
})();
})();
</script>
</body>
</html>
