<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Silver Air Aircraft Cleaning App (Copy) (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#E6EAEF; --surface-3:#F6F8FA;
  --ink:#0F1C2B; --ink-2:#4A5868; --ink-3:#77838F; --line:#D3DAE2; --line-2:#E3E8ED;
  --accent:#1F4FBF; --accent-ink:#FFFFFF; --accent-soft:#E2E9F9; --focus:#1F4FBF;
  --placard:#0F1C2B; --placard-ink:#FFFFFF;
  --s-req:#9A5B00; --s-req-bg:#FBEBCB;
  --s-acc:#1F4FBF; --s-acc-bg:#E2E9F9;
  --s-wip:#0A6A7A; --s-wip-bg:#D5EEF2;
  --s-done:#1B6E38; --s-done-bg:#D8EFDF;
  --s-inv:#4F43A6; --s-inv-bg:#E7E4F7;
  --s-bad:#A8281C; --s-bad-bg:#F9DEDA;
  --s-off:#5F6B77; --s-off-bg:#E4E8EC;
  --shadow:0 10px 30px rgba(15,28,43,.14), 0 2px 6px rgba(15,28,43,.08);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B131C; --surface:#121D29; --surface-2:#1A2734; --surface-3:#16222E;
    --ink:#E4EBF2; --ink-2:#9DAEBF; --ink-3:#738495; --line:#263747; --line-2:#1F2E3C;
    --accent:#7AA2FF; --accent-ink:#0B131C; --accent-soft:#1C2C4C; --focus:#7AA2FF;
    --placard:#E4EBF2; --placard-ink:#0B131C;
    --s-req:#F2B454; --s-req-bg:#3A2A0E;
    --s-acc:#8FB0FF; --s-acc-bg:#1C2C4C;
    --s-wip:#5CC9D8; --s-wip-bg:#0F3239;
    --s-done:#6ED18E; --s-done-bg:#12321E;
    --s-inv:#B1A8F2; --s-inv-bg:#282352;
    --s-bad:#FF8A7D; --s-bad-bg:#3E1A16;
    --s-off:#A0AEBB; --s-off-bg:#223040;
    --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B131C; --surface:#121D29; --surface-2:#1A2734; --surface-3:#16222E;
  --ink:#E4EBF2; --ink-2:#9DAEBF; --ink-3:#738495; --line:#263747; --line-2:#1F2E3C;
  --accent:#7AA2FF; --accent-ink:#0B131C; --accent-soft:#1C2C4C; --focus:#7AA2FF;
  --placard:#E4EBF2; --placard-ink:#0B131C;
  --s-req:#F2B454; --s-req-bg:#3A2A0E;
  --s-acc:#8FB0FF; --s-acc-bg:#1C2C4C;
  --s-wip:#5CC9D8; --s-wip-bg:#0F3239;
  --s-done:#6ED18E; --s-done-bg:#12321E;
  --s-inv:#B1A8F2; --s-inv-bg:#282352;
  --s-bad:#FF8A7D; --s-bad-bg:#3E1A16;
  --s-off:#A0AEBB; --s-off-bg:#223040;
  --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.1}
h2{font-size:20px}
h3{font-size:16px;font-weight:600}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.mono{font-family:var(--f-mono)}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:20px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--ink-2);letter-spacing:0}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.nav button{background:none;border:0;padding:18px 12px 16px;cursor:pointer;color:var(--ink-2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav button:hover{color:var(--ink)}
.badge{background:var(--s-bad);color:var(--surface);border-radius:999px;font-size:11px;padding:0 6px;line-height:17px;font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.who img{width:26px;height:26px;border-radius:50%}
.who b{color:var(--ink);font-weight:600}
@media (max-width:720px){
  .top-in{gap:0 12px;padding-top:10px}
  .nav{order:3;flex-basis:100%;margin-inline:-8px}
  .nav button{padding:10px 8px 10px}
  .who span.role{display:none}
}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.viewas select{min-height:32px;padding:4px 8px;font-size:13px;width:auto;max-width:200px}
.banner.preview{background:var(--accent-soft);border-color:var(--accent);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.track{display:flex;flex-direction:column;gap:4px;font-size:13.5px;border-top:1px solid var(--line-2);padding-top:10px}
.drawer .track{border-top:0;padding-top:0}
.trk{font-weight:600;display:inline-flex;align-items:center;gap:6px}
.trk::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.trk.air{color:var(--s-wip)} .trk.gnd{color:var(--s-done)} .trk.off{color:var(--ink-3)}
.tlinks{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.tlinks a{color:var(--accent);text-decoration:none;font-weight:600}
.tlinks a:hover{text-decoration:underline}
.banner{background:var(--s-req-bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}

/* Buttons & form */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:600;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--s-bad);border-color:color-mix(in srgb,var(--s-bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:38px}
textarea.input{resize:vertical;min-height:70px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--surface);font-size:14px}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.check input{accent-color:var(--accent);margin:0}
.err{color:var(--s-bad);font-size:13px;font-weight:600}

/* Page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph p{margin:4px 0 0}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;display:flex;gap:6px;align-items:center}
.chip .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] .n{color:var(--surface);opacity:.75}
.search{flex:1;min-width:180px;max-width:320px;margin-left:auto}

/* Tail placard */
.tail{display:inline-block;font-family:var(--f-mono);font-weight:600;letter-spacing:.06em;background:var(--placard);color:var(--placard-ink);border-radius:3px;padding:1px 7px;font-size:13.5px;line-height:1.5}
.tail.lg{font-size:20px;padding:2px 10px}

/* Status pill */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 9px;white-space:nowrap;line-height:1.6}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-requested{color:var(--s-req);background:var(--s-req-bg)}
.st-accepted{color:var(--s-acc);background:var(--s-acc-bg)}
.st-in_progress{color:var(--s-wip);background:var(--s-wip-bg)}
.st-completed{color:var(--s-done);background:var(--s-done-bg)}
.st-invoiced{color:var(--s-inv);background:var(--s-inv-bg)}
.st-declined{color:var(--s-bad);background:var(--s-bad-bg)}
.st-cancelled{color:var(--s-off);background:var(--s-off-bg)}
.flag{font-size:11.5px;font-weight:700;color:var(--s-bad);text-transform:uppercase;letter-spacing:.05em}

/* Job list */
.day{margin-top:22px}
.day:first-child{margin-top:0}
.day h3{font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.day h3 .muted{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.job{display:grid;grid-template-columns:118px 92px minmax(0,1.3fr) minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,.9fr);gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-2);padding:12px 16px;cursor:pointer}
.job:first-child{border-top:0}
.job:hover{background:var(--surface-3)}
.job .ac{font-weight:600;min-width:0}
.job .ac small{display:block;font-weight:400;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .when{font-size:13.5px;font-variant-numeric:tabular-nums;min-width:0}
.job .when small{display:block;color:var(--ink-2)}
.job .svc{font-size:13.5px;color:var(--ink-2);min-width:0}
.job .ven{font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .ven.none{color:var(--s-bad)}
@media (max-width:900px){
  .job{grid-template-columns:auto 1fr auto;grid-template-areas:"tail ac st" "when when when" "svc svc ven";gap:4px 12px}
  .job .c-st{grid-area:st}.job .c-tail{grid-area:tail}.job .ac{grid-area:ac}.job .when{grid-area:when}.job .svc{grid-area:svc}.job .ven{grid-area:ven;text-align:right}
  .job .when small{display:inline;margin-left:6px}
}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty h2{color:var(--ink);margin-bottom:6px}

/* Calendar */
.cal-nav{display:flex;gap:8px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.cal .col{border-left:1px solid var(--line-2);min-height:260px;display:flex;flex-direction:column}
.cal .col:first-child{border-left:0}
.cal .dh{padding:8px 10px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink-2)}
.cal .dh b{font-size:20px;color:var(--ink);letter-spacing:0}
.cal .col.today .dh{background:var(--accent-soft)}
.cal .col.today .dh b{color:var(--accent)}
.cal .items{padding:6px;display:flex;flex-direction:column;gap:6px}
.ev{text-align:left;border:1px solid var(--line);border-left:3px solid var(--c,var(--line));background:var(--surface-3);border-radius:4px;padding:6px 8px;cursor:pointer;font-size:12.5px;line-height:1.35}
.ev:hover{background:var(--surface-2)}
.ev .t{font-family:var(--f-mono);font-weight:600;font-size:12.5px}
.ev .m{color:var(--ink-2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:820px){
  .cal{grid-template-columns:1fr}
  .cal .col{border-left:0;border-top:1px solid var(--line-2);min-height:0}
  .cal .col:first-child{border-top:0}
  .cal .items:empty::after{content:"No jobs";color:var(--ink-3);font-size:13px;padding:2px 4px}
}

/* Fleet */
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ac-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ac-card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ac-card .ty{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.15}
.ac-card .meta{font-size:13px;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.cls{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:0 6px}
.ac-card .ft{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

/* Settings */
.sections{display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel > h2{margin-bottom:4px}
.panel > p.muted{margin:0 0 14px;max-width:70ch}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:180px}
.row .person{display:flex;gap:10px;align-items:center;flex:1;min-width:200px}
.row .person img{width:30px;height:30px;border-radius:50%}
.addform{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.addform .field{flex:1;min-width:140px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 11px;font-size:13.5px;background:var(--surface-3)}
.tag button{border:0;background:none;cursor:pointer;color:var(--ink-3);border-radius:50%;width:22px;height:22px;line-height:1}
.tag button:hover{background:var(--surface-2);color:var(--s-bad)}
ol.how{margin:0;padding-left:20px;display:grid;gap:6px;max-width:75ch}

/* Gate */
.gate{max-width:540px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:grid;gap:16px}
.gate h1{font-size:26px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(8,15,24,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-hd{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-hd .t{flex:1;min-width:0}
.dr-hd .ty{font-family:var(--f-display);font-weight:600;font-size:19px;margin-top:6px}
.dr-hd .ref{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.dr-body{overflow-y:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:20px}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stepper div{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding-top:8px;border-top:3px solid var(--line)}
.stepper div.on{color:var(--ink);border-top-color:var(--accent)}
.stepper div.now{color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.facts div{min-width:0}
.facts b{display:block;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.svcs{display:flex;gap:6px;flex-wrap:wrap}
.svcs span{background:var(--surface-2);border-radius:4px;padding:3px 9px;font-size:13.5px;font-weight:500}
.note{background:var(--surface-3);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actbox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos button{padding:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;aspect-ratio:1;background:var(--surface-2);cursor:zoom-in;max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.ph-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.feed{display:flex;flex-direction:column;gap:12px}
.fe{display:grid;grid-template-columns:28px 1fr;gap:10px}
.fe img{width:28px;height:28px;border-radius:50%}
.fe .h{font-size:13px;color:var(--ink-2)}
.fe .h b{color:var(--ink)}
.fe .x{overflow-wrap:anywhere;white-space:pre-wrap}
.fe.sys .x{color:var(--ink-2);font-size:14px}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal .box{position:relative;background:var(--surface);border-radius:8px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:22px;display:grid;gap:16px}
.modal .box.wide{width:min(1000px,100%);padding:10px}
.modal .box.wide img{width:100%;height:auto;border-radius:4px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">Silver Air <small>Cleaning Desk</small></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="who" id="who"></div>
  </div>
</header>
<main class="wrap" id="main">
  <div class="empty"><span class="spin"></span> Loading jobs…</div>
</main>
<div id="drawerHost"></div>
<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const main = $('#main');

/* ---------- constants ---------- */
const FLOW = ['requested','accepted','in_progress','completed','invoiced'];
const STATUS = {
  requested:{label:'Requested'}, accepted:{label:'Accepted'}, in_progress:{label:'In progress'},
  completed:{label:'Completed'}, invoiced:{label:'Invoiced'}, declined:{label:'Declined'}, cancelled:{label:'Cancelled'}
};
const STATUS_VAR = {requested:'--s-req',accepted:'--s-acc',in_progress:'--s-wip',completed:'--s-done',invoiced:'--s-inv',declined:'--s-bad',cancelled:'--s-off'};
const FILTERS = [
  {k:'active', label:'Open', st:['requested','accepted','in_progress','declined']},
  {k:'awaiting', label:'Awaiting vendor', st:['requested','declined']},
  {k:'progress', label:'Scheduled & in progress', st:['accepted','in_progress']},
  {k:'completed', label:'Completed', st:['completed']},
  {k:'invoiced', label:'Invoiced', st:['invoiced']},
  {k:'all', label:'All', st:null},
];

/* ---------- state ---------- */
const S = {
  ready:false, noDb:false, db:null, user:null, uid:null, owner:false, canWrite:null, readOnly:false,
  fleet:[], tracking:{}, vendors:[], config:{services:[],airports:[]}, jobs:[], roles:{}, requests:[], myRequest:undefined,
  view:lsGet('view') || 'jobs', filter:'active', q:'', week:startOfWeek(new Date()),
  openId:null, action:null, names:{}, avatars:{}, emails:{}, guestVendor:lsGet('guestVendor'), viewAs:lsGet('viewAs'),
  assets:undefined, fresh:false
};

function lsGet(k){ try{ return localStorage.getItem('sacd.'+k); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null ? localStorage.removeItem('sacd.'+k) : localStorage.setItem('sacd.'+k,v); }catch(e){} }

/* ---------- utils ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x; }
function pd(s){ if(!s) return null; const d=new Date(s); return isNaN(d)?null:d; }
function dayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fDate(d){ return WD[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]; }
function fTime(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fDT(s){ const d=pd(s); return d? fDate(d)+' · '+fTime(d) : '—'; }
function sameDay(a,b){ return a&&b&&dayKey(a)===dayKey(b); }
function dayLabel(d){ const t=new Date(); t.setHours(0,0,0,0); const diff=Math.round((new Date(d).setHours(0,0,0,0)-t)/864e5);
  if(diff===0) return 'Today'; if(diff===1) return 'Tomorrow'; if(diff===-1) return 'Yesterday'; return fDate(d); }
function ago(iso){ const d=pd(iso); if(!d) return ''; const m=Math.round((Date.now()-d)/6e4);
  if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<24) return h+' h ago'; return fDate(d)+' '+fTime(d); }
function money(n){ if(n===''||n==null||isNaN(+n)) return ''; return '$'+(+n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function toLocalInput(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || ('v'+Date.now()); }
function makeRef(){ const d=new Date(); const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r=''; for(let i=0;i<4;i++) r+=c[Math.floor(Math.random()*c.length)];
  return 'SA-'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+r; }
function toast(msg){ const h=$('#toastHost'); h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>'; clearTimeout(toast.t); toast.t=setTimeout(()=>h.innerHTML='',3200); }

/* ---------- roles ---------- */
function me(){
  if(S.owner){ if(S.viewAs && vendorById(S.viewAs)) return {role:'vendor', vendorId:S.viewAs, preview:true}; return {role:'admin'}; }
  const r = S.uid && S.roles[S.uid];
  if(r && (r.role==='staff' || (r.role==='vendor' && r.vendorId))) return r;
  if(!S.uid && S.guestVendor && vendorById(S.guestVendor)) return {role:'vendor', vendorId:S.guestVendor, guest:true};
  return null;
}
const isStaff = () => { const m=me(); return !!m && (m.role==='admin'||m.role==='staff'); };
const isVendor = () => { const m=me(); return !!m && m.role==='vendor'; };
function vendorById(id){ return S.vendors.find(v=>v.id===id); }
function aircraft(tail){ return S.fleet.find(a=>a.tail===tail); }
function orgLabel(){ const m=me(); if(!m) return ''; if(m.role==='vendor') return (vendorById(m.vendorId)||{}).name||'Vendor'; return 'Silver Air'; }
function roleLabel(){ const m=me(); if(!m) return ''; if(m.role==='admin') return 'Silver Air · Admin'; if(m.role==='staff') return 'Silver Air'; return orgLabel(); }
function visibleJobs(){
  if(isStaff()) return S.jobs;
  if(isVendor()){ const v=me().vendorId; return S.jobs.filter(j=>j.vendorId===v); }
  return [];
}
function isOverdue(j){ const d=pd(j.due); return d && d<new Date() && ['requested','accepted','in_progress','declined'].includes(j.status); }

/* ---------- names ---------- */
const pendingNames = new Set();
async function resolveNames(ids){
  if(!S.user) return;
  const need = [...new Set(ids.filter(id=>id && !(id in S.names) && !pendingNames.has(id)))];
  if(!need.length) return;
  need.forEach(i=>pendingNames.add(i));
  try{
    const ps = await S.user.profiles(need);
    let changed=false;
    for(const id of need){ const p=ps[id]; if(!p) continue; S.names[id]=p.name||''; S.avatars[id]=p.avatarUrl; S.emails[id]=p.email||''; changed=true; }
    if(changed) render();
  }catch(e){}
}
function nameOf(id, fallback){ return (id && S.names[id]) || fallback || 'Someone'; }
function avatarOf(id){ return (id && S.avatars[id]) || 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><circle cx="14" cy="14" r="14" fill="#8795a3"/></svg>'); }

/* ---------- rendering helpers ---------- */
function patch(el, html){
  const keep = !S.fresh;
  const saved = {};
  if(keep) el.querySelectorAll('input[id],textarea[id],select[id]').forEach(i=>{ if(i.type==='file') return; saved[i.id] = (i.type==='checkbox'||i.type==='radio') ? {c:i.checked} : {v:i.value}; });
  const a = document.activeElement; const aid = a && el.contains(a) && a.id ? a.id : null;
  let sel=null; try{ if(aid && a.selectionStart!=null) sel=[a.selectionStart,a.selectionEnd]; }catch(e){}
  el.innerHTML = html;
  if(keep){
    for(const id in saved){ const i = el.querySelector('#'+CSS.escape(id)); if(!i) continue; if('c' in saved[id]) i.checked=saved[id].c; else i.value=saved[id].v; }
    if(aid){ const i=el.querySelector('#'+CSS.escape(aid)); if(i){ i.focus({preventScroll:true}); if(sel) try{ i.setSelectionRange(sel[0],sel[1]); }catch(e){} } }
  }
}
function stPill(s){ return '<span class="st st-'+esc(s)+'">'+esc((STATUS[s]||{}).label||s)+'</span>'; }
function tailTag(t,lg){ return '<span class="tail'+(lg?' lg':'')+'">'+esc(t)+'</span>'; }

function render(){
  renderNav(); renderWho();
  if(!S.ready){
    main.innerHTML = S.noDb
      ? '<div class="empty"><h2>Live data isn’t available here</h2><p>Open this app from its claude.ai link while signed in to see and schedule cleanings.</p></div>'
      : '<div class="empty"><span class="spin"></span> Loading jobs…</div>';
    return;
  }
  const m = me();
  if(!m){ patch(main, renderGate()); renderDrawer(); S.fresh=false; return; }
  if(m.preview && S.view==='settings') S.view='jobs';
  let html = m.preview ? '<div class="banner preview"><span><b>Previewing as '+esc(orgLabel())+'.</b> This is exactly what their team sees. Anything you do here is real and logged as '+esc(orgLabel())+'.</span><button class="btn sm" data-act="viewas-exit">Back to admin view</button></div>' : '';
  html += S.readOnly ? '<div class="banner">You have view-only access. Ask Silver Air to share this app with you as <b>Can edit</b> to update jobs.</div>' : '';
  if(S.view==='calendar') html += renderCalendar();
  else if(S.view==='fleet') html += renderFleet();
  else if(S.view==='settings' && S.owner && !m.preview) html += renderSettings();
  else html += renderJobs();
  patch(main, html);
  renderDrawer();
  S.fresh=false;
  // names on screen
  const ids = new Set();
  visibleJobs().forEach(j=>{ ids.add(j.requestedBy); (j.activity||[]).forEach(a=>ids.add(a.by)); });
  Object.keys(S.roles).forEach(i=>ids.add(i)); S.requests.forEach(r=>ids.add(r.id));
  if(S.uid) ids.add(S.uid);
  resolveNames([...ids].filter(Boolean));
}

function renderNav(){
  const m = S.ready && me();
  if(!m){ $('#nav').innerHTML=''; return; }
  const tabs=[['jobs','Jobs'],['calendar','Calendar'],['fleet','Fleet']];
  if(S.owner && !m.preview) tabs.push(['settings','Settings']);
  const pend = S.owner ? S.requests.length : 0;
  $('#nav').innerHTML = tabs.map(([k,l])=>'<button data-act="view" data-v="'+k+'"'+(S.view===k?' aria-current="page"':'')+'>'+l+(k==='settings'&&pend?' <span class="badge">'+pend+'</span>':'')+'</button>').join('');
}
function renderWho(){
  const m = S.ready && me();
  if(!m){ $('#who').innerHTML=''; return; }
  const nm = S.uid ? (S.names[S.uid] || '') : '';
  $('#who').innerHTML = (S.uid?'<img alt="" src="'+esc(avatarOf(S.uid))+'">':'')+'<span>'+(nm?'<b>'+esc(nm)+'</b> · ':'')+'<span class="role">'+esc(roleLabel())+'</span></span>'
    + (m.guest ? ' <button class="btn ghost sm" data-act="guest-reset">Switch</button>' : '')
    + (S.owner ? ' <label class="viewas"><span class="sr">View as</span><select class="input" id="viewas" aria-label="View the app as"><option value="">View as: Admin</option>'+S.vendors.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(v=>'<option value="'+esc(v.id)+'"'+(v.id===S.viewAs?' selected':'')+'>View as: '+esc(v.name)+'</option>').join('')+'</select></label>' : '');
}

/* ---------- gate (access request) ---------- */
function renderGate(){
  const vendors = S.vendors.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const vOpts = vendors.map(v=>'<option value="'+esc(v.id)+'">'+esc(v.name)+'</option>').join('');
  if(!S.uid){
    return '<div class="gate"><h1>Which company are you with?</h1>'
      + '<p class="muted">Pick your cleaning company to see the jobs Silver Air has sent you.</p>'
      + '<label class="field"><span>Company</span><select class="input" id="g-vendor"><option value="">Select…</option>'+vOpts+'</select></label>'
      + '<div><button class="btn primary" data-act="guest-pick">Continue</button></div></div>';
  }
  const r = S.myRequest;
  if(r){
    const who = r.role==='staff' ? 'Silver Air staff' : ((vendorById(r.vendorId)||{}).name || 'a cleaning company');
    return '<div class="gate"><h1>Access requested</h1><p>You asked to join as <b>'+esc(who)+'</b>. Silver Air will approve it shortly — this page updates on its own once they do.</p>'
      + '<div><button class="btn ghost" data-act="req-withdraw">Change request</button></div></div>';
  }
  return '<div class="gate"><h1>Request access</h1>'
    + '<p class="muted">Silver Air uses this desk to schedule aircraft cleanings with its vendors. Tell us who you are and an admin will approve you.</p>'
    + '<div class="checks" role="radiogroup">'
    + '<label class="check"><input type="radio" name="g-role" id="g-role-vendor" value="vendor" checked> Cleaning company</label>'
    + '<label class="check"><input type="radio" name="g-role" id="g-role-staff" value="staff"> Silver Air staff</label></div>'
    + '<label class="field"><span>Company (cleaning vendors)</span><select class="input" id="g-vendor"><option value="">Select…</option>'+vOpts+'</select></label>'
    + '<label class="field"><span>Note for the admin (optional)</span><input class="input" id="g-note" placeholder="e.g. Ops lead at KVNY"></label>'
    + '<div id="g-err" class="err" hidden></div>'
    + '<div><button class="btn primary" data-act="req-submit">Request access</button></div></div>';
}

/* ---------- jobs view ---------- */
function filtered(){
  const f = FILTERS.find(x=>x.k===S.filter) || FILTERS[0];
  const q = S.q.trim().toLowerCase();
  return visibleJobs().filter(j=>{
    if(f.st && !f.st.includes(j.status)) return false;
    if(!q) return true;
    const ac=aircraft(j.tail)||{}; const v=vendorById(j.vendorId)||{};
    return [j.tail,j.airport,j.fbo,ac.type,v.name,j.ref,(j.services||[]).join(' ')].join(' ').toLowerCase().includes(q);
  });
}
function renderJobs(){
  const staff = isStaff();
  const vis = visibleJobs();
  const counts = {}; FILTERS.forEach(f=>counts[f.k]= f.st? vis.filter(j=>f.st.includes(j.status)).length : vis.length);
  let h = '<div class="ph"><div><h1>Cleaning jobs</h1><p class="muted">'
    + (staff ? 'Every cleaning requested across the fleet.' : 'Jobs Silver Air has sent to '+esc(orgLabel())+'.')
    + '</p></div>'
    + (staff && !S.readOnly ? '<button class="btn primary" data-act="new-job">+ New cleaning</button>' : '') + '</div>';
  h += '<div class="tools"><div class="chips">' + FILTERS.map(f=>'<button class="chip" data-act="filter" data-f="'+f.k+'" aria-pressed="'+(S.filter===f.k)+'">'+esc(f.label)+' <span class="n">'+counts[f.k]+'</span></button>').join('') + '</div>'
    + '<input class="input search" id="q" type="search" placeholder="Search tail, airport, vendor" aria-label="Search jobs" value="'+esc(S.q)+'"></div>';
  const list = filtered();
  if(!list.length){
    const none = !vis.length;
    h += '<div class="empty">'+(none
      ? (staff ? '<h2>No cleanings scheduled yet</h2><p>Pick an aircraft, a window and a vendor — the vendor gets it on their board right away.</p>'+(S.readOnly?'':'<p><button class="btn primary" data-act="new-job">+ New cleaning</button></p>')
               : '<h2>No jobs yet</h2><p>When Silver Air sends '+esc(orgLabel())+' a cleaning, it shows up here.</p>')
      : '<h2>Nothing matches</h2><p>Try a different filter or search.</p>')+'</div>';
    return h;
  }
  const desc = ['completed','invoiced'].includes(S.filter);
  list.sort((a,b)=> (desc?-1:1) * ((pd(a.start)||0)-(pd(b.start)||0)));
  const groups = []; let cur=null;
  for(const j of list){ const d=pd(j.start); const k=d?dayKey(d):'none'; if(!cur||cur.k!==k){ cur={k,d,items:[]}; groups.push(cur);} cur.items.push(j); }
  for(const g of groups){
    h += '<section class="day"><h3>'+(g.d?esc(dayLabel(g.d))+(dayLabel(g.d)!==fDate(g.d)?' <span class="muted">'+esc(fDate(g.d))+'</span>':''):'No date')+'</h3><div class="list">';
    for(const j of g.items) h += jobRow(j);
    h += '</div></section>';
  }
  return h;
}
function jobRow(j){
  const ac = aircraft(j.tail)||{}; const v = vendorById(j.vendorId);
  const s=pd(j.start), d=pd(j.due);
  const when = (s?fTime(s):'—') + ' → ' + (d ? (sameDay(s,d)? fTime(d) : fDate(d)+' '+fTime(d)) : '—');
  return '<button class="job" data-act="open" data-id="'+esc(j.id)+'">'
    + '<span class="c-st">'+stPill(j.status)+'</span>'
    + '<span class="c-tail">'+tailTag(j.tail)+'</span>'
    + '<span class="ac">'+esc(ac.type||'Aircraft')+'<small>'+esc([j.airport,j.fbo].filter(Boolean).join(' · '))+'</small></span>'
    + '<span class="when">'+esc(when)+' <small>'+(isOverdue(j)?'<span class="flag">Overdue</span>':'local time')+'</small></span>'
    + '<span class="svc">'+esc((j.services||[]).join(' · '))+'</span>'
    + '<span class="ven'+(v?'':' none')+'">'+esc(v?v.name:'No vendor')+'</span>'
    + '</button>';
}

/* ---------- calendar ---------- */
function renderCalendar(){
  const ws = S.week; const days=[...Array(7)].map((_,i)=>{ const d=new Date(ws); d.setDate(d.getDate()+i); return d; });
  const we = new Date(days[6]);
  const jobs = visibleJobs().filter(j=>j.status!=='cancelled');
  const today = new Date();
  let h = '<div class="ph"><div><h1>Calendar</h1><p class="muted">'+esc(ws.getDate()+' '+MO[ws.getMonth()]+' – '+we.getDate()+' '+MO[we.getMonth()]+' '+we.getFullYear())+' · jobs shown on the day the aircraft becomes available</p></div>'
    + '<div class="cal-nav"><button class="btn sm" data-act="wk" data-d="-1" aria-label="Previous week">‹ Prev</button><button class="btn sm" data-act="wk" data-d="0">This week</button><button class="btn sm" data-act="wk" data-d="1" aria-label="Next week">Next ›</button>'
    + (isStaff()&&!S.readOnly?'<button class="btn primary sm" data-act="new-job">+ New cleaning</button>':'')+'</div></div>';
  h += '<div class="cal">';
  for(const d of days){
    const items = jobs.filter(j=>sameDay(pd(j.start),d)).sort((a,b)=>pd(a.start)-pd(b.start));
    h += '<div class="col'+(sameDay(d,today)?' today':'')+'"><div class="dh"><span>'+WD[d.getDay()]+'</span><b>'+d.getDate()+'</b></div><div class="items">'
      + items.map(j=>{ const ac=aircraft(j.tail)||{}; const v=vendorById(j.vendorId);
          return '<button class="ev" style="--c:var('+STATUS_VAR[j.status]+')" data-act="open" data-id="'+esc(j.id)+'"><span class="t">'+esc(j.tail)+'</span> '+esc(fTime(pd(j.start)))+'<span class="m">'+esc(j.airport||'')+' · '+esc(ac.type||'')+'</span><span class="m">'+esc(v?v.name:'No vendor')+' · '+esc(STATUS[j.status].label)+'</span></button>'; }).join('')
      + '</div></div>';
  }
  return h + '</div>';
}

/* ---------- fleet ---------- */
function renderFleet(){
  const staff = isStaff();
  const vis = visibleJobs();
  let h = '<div class="ph"><div><h1>Fleet</h1><p class="muted">'+S.fleet.length+' aircraft · last and next cleaning for each tail</p></div>'
    + (S.owner?'<button class="btn" data-act="ac-new">+ Add aircraft</button>':'')+'</div>';
  const fleet = S.fleet.slice().sort((a,b)=>(a.order??99)-(b.order??99) || a.tail.localeCompare(b.tail));
  h += '<div class="fleet">';
  for(const a of fleet){
    const mine = vis.filter(j=>j.tail===a.tail);
    const last = mine.filter(j=>['completed','invoiced'].includes(j.status)).sort((x,y)=>(pd(y.completedAt||y.due)||0)-(pd(x.completedAt||x.due)||0))[0];
    const next = mine.filter(j=>['requested','accepted','in_progress','declined'].includes(j.status)).sort((x,y)=>pd(x.start)-pd(y.start))[0];
    h += '<article class="ac-card"><div class="hd">'+tailTag(a.tail,true)+(a.size?'<span class="cls">'+esc(a.size)+'</span>':'')+'</div>'
      + '<div><div class="ty">'+esc(a.type||'')+'</div><div class="meta">'+esc([a.model, a.year, a.serial?'s/n '+a.serial:''].filter(Boolean).join(' · '))+'</div></div>'
      + '<dl class="kv"><dt>Home base</dt><dd>'+esc(a.homeBase||'—')+'</dd>'
      + '<dt>Last clean</dt><dd>'+(last? esc(fDate(pd(last.completedAt||last.due)))+' · '+esc((last.services||[])[0]||'') : '—')+'</dd>'
      + '<dt>Next</dt><dd>'+(next? '<a href="#" data-act="open" data-id="'+esc(next.id)+'">'+esc(fDT(next.start))+'</a> '+stPill(next.status) : '—')+'</dd>'
      + (a.notes?'<dt>Notes</dt><dd>'+esc(a.notes)+'</dd>':'')+'</dl>'
      + trackBlock(a.tail)
      + '<div class="ft">'+(staff&&!S.readOnly?'<button class="btn sm primary" data-act="new-job" data-tail="'+esc(a.tail)+'">Schedule cleaning</button>':'')
      + (S.owner?'<button class="btn sm ghost" data-act="ac-edit" data-tail="'+esc(a.tail)+'">Edit</button>':'')+'</div></article>';
  }
  return h+'</div>';
}

/* ---------- tracking ---------- */
function trackBlock(tail){
  const t = S.tracking[tail];
  const links = '<span class="tlinks"><a href="https://globe.adsbexchange.com/?reg='+encodeURIComponent(tail)+'" target="_blank" rel="noopener">ADS-B Exchange ↗</a><a href="https://www.flightaware.com/live/flight/'+encodeURIComponent(tail)+'" target="_blank" rel="noopener">FlightAware ↗</a>'
    + (t && t.lat!=null && t.lon!=null ? '<a href="https://www.openstreetmap.org/?mlat='+(+t.lat)+'&mlon='+(+t.lon)+'&zoom=13" target="_blank" rel="noopener">Map ↗</a>' : '') + '</span>';
  let line;
  if(!t) line = '<span class="trk off">No position data yet</span>';
  else {
    const where = t.near ? ' '+(t.state==='airborne'?'near':'at')+' <span class="mono">'+esc(t.near)+'</span>' : '';
    if(t.state==='airborne') line = '<span class="trk air">Airborne'+where+'</span> <span class="small muted">'+esc([t.altFt?(t.altFt>=18000?'FL'+Math.round(t.altFt/100):Math.round(t.altFt).toLocaleString()+' ft'):'', t.gsKt?Math.round(t.gsKt)+' kt':'', t.callsign||''].filter(Boolean).join(' · '))+'</span>';
    else if(t.state==='ground') line = '<span class="trk gnd">On ground'+where+'</span>';
    else line = '<span class="trk off">Not broadcasting'+(t.seenAt? ' · last seen'+where+' '+esc(ago(t.seenAt)) : '')+'</span>';
    line += '<span class="small muted"> · checked '+esc(ago(t.checkedAt))+'</span>';
  }
  return '<div class="track">'+line+links+'</div>';
}

/* ---------- drawer ---------- */
function renderDrawer(){
  const host = $('#drawerHost');

  const ac = aircraft(j.tail)||{}; const v = vendorById(j.vendorId);
  const staff = isStaff(), vend = isVendor();

  let h = '<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Job '+esc(j.tail)+'">'
    + '<div class="dr-hd"><div class="t">'+tailTag(j.tail,true)+' '+stPill(j.status)+(isOverdue(j)?' <span class="flag">Overdue</span>':'')
    + '<div class="ty">'+esc(ac.type||'')+(ac.size?' <span class="cls">'+esc(ac.size)+'</span>':'')+'</div><div class="ref">'+esc(j.ref||j.id)+'</div></div>'
    + '<button class="btn ghost" data-act="close" aria-label="Close">✕</button></div><div class="dr-body">';

  if(idx>=0) h += '<div class="stepper">'+FLOW.map((s,i)=>'<div class="'+(i<=idx?'on':'')+(i===idx?' now':'')+'">'+esc(STATUS[s].label)+'</div>').join('')+'</div>';

  h += '<div class="facts">'
    + '<div><span class="label">Airport / FBO</span><b>'+esc([j.airport,j.fbo].filter(Boolean).join(' · ')||'—')+'</b></div>'
    + '<div><span class="label">Vendor</span><b>'+esc(v?v.name:'Not assigned')+'</b></div>'
    + '<div><span class="label">Available from (LT)</span><b>'+esc(fDT(j.start))+'</b></div>'
    + '<div><span class="label">Complete by (LT)</span><b>'+esc(fDT(j.due))+'</b></div>'
    + '<div><span class="label">Requested by</span><b>'+esc(nameOf(j.requestedBy,'Silver Air'))+'</b></div>'
    + '<div><span class="label">'+(j.invoiceNo?'Invoice':'Quote')+'</span><b>'+esc(j.invoiceNo? '#'+j.invoiceNo+' · '+money(j.invoiceAmount) : (money(j.quote)||'—'))+'</b></div>'
    + '</div>';
  h += '<div><div class="label" style="margin-bottom:6px">Services</div><div class="svcs">'+(j.services||[]).map(s=>'<span>'+esc(s)+'</span>').join('')+'</div></div>';
  h += '<div><div class="label" style="margin-bottom:6px">Aircraft position (ADS-B)</div>'+trackBlock(j.tail)+'</div>';
  if(j.notes) h += '<div><div class="label" style="margin-bottom:6px">Instructions</div><div class="note">'+esc(j.notes)+'</div></div>';
  if(j.status==='declined' && j.declineReason) h += '<div><div class="label" style="margin-bottom:6px">Declined because</div><div class="note">'+esc(j.declineReason)+'</div></div>';

  if(!S.readOnly){
    const acts = [];
    const canVendorAct = vend || staff;
    if(canVendorAct){
      if(j.status==='requested') { acts.push(['accept','Accept job','primary']); acts.push(['decline','Decline','']); }
      if(j.status==='accepted') acts.push(['start','Start work','primary']);
      if(j.status==='in_progress') acts.push(['complete','Mark complete','primary']);
      if(j.status==='completed') acts.push(['invoice','Add invoice','primary']);
    }
    if(staff){
      if(['requested','declined'].includes(j.status)) acts.push(['reassign', j.status==='declined'?'Send to another vendor':'Change vendor', j.status==='declined'?'primary':'']);
      if(['requested','accepted','in_progress','declined'].includes(j.status)){ acts.push(['edit','Edit details','']); acts.push(['cancel','Cancel job','danger']); }
      if(j.status==='cancelled') acts.push(['reopen','Reopen','']);
      if(S.owner && !me().preview) acts.push(['delete','Delete job','ghost danger']);
    }
    if(acts.length){
      h += '<div class="actions">'+acts.map(([k,l,c])=>'<button class="btn '+c+'" data-act="jact" data-k="'+k+'"'+(S.action===k?' aria-pressed="true"':'')+'>'+esc(l)+'</button>').join('')+'</div>';
      if(staff && vend===false && ['requested','accepted','in_progress','completed'].includes(j.status) && ['accept','decline','start','complete','invoice'].includes(S.action)) h += '<p class="small muted" style="margin:-10px 0 0">You’re updating this on the vendor’s behalf.</p>';
    }
    if(S.action) h += actionBox(j);
  }

  // photos
  const photos = j.photos||[];
  const canUpload = !S.readOnly && S.assets && (staff || vend) && !['cancelled'].includes(j.status);
  for(const kind of ['before','after']){
    const ps = photos.filter(p=>p.kind===kind);
    if(!ps.length && !canUpload) continue;
    h += '<div><div class="ph-hd"><span class="label">'+(kind==='before'?'Before':'After')+' photos · '+ps.length+'</span>'
      + (canUpload?'<label class="btn sm upl">Add photos<input type="file" accept="image/*" multiple data-upload="'+kind+'" aria-label="Add '+kind+' photos"></label>':'')+'</div>'
      + (ps.length?'<div class="photos">'+ps.map(p=>'<button data-act="photo" data-src="/_blob/'+esc(p.id)+'" aria-label="View photo"><img loading="lazy" alt="'+kind+' photo" src="/_blob/'+esc(p.id)+'"></button>').join('')+'</div>':'<p class="small muted" style="margin:0">None yet.</p>')+'</div>';
  }
  if(S.uploading) h += '<p class="small"><span class="spin"></span> Uploading photos…</p>';

  // activity
  const acts = (j.activity||[]).slice().reverse();
  h += '<div><div class="sec-t"><span class="label">Activity</span></div>';
  if(!S.readOnly) h += '<div style="display:grid;gap:8px;margin-bottom:14px"><textarea class="input" id="cm-'+esc(j.id)+'" rows="2" placeholder="Message '+esc(staff?(v?v.name:'the vendor'):'Silver Air')+'…" aria-label="Write a comment"></textarea><div><button class="btn sm" data-act="comment">Post comment</button></div></div>';
  h += '<div class="feed">'+acts.map(a=>'<div class="fe'+(a.type==='comment'?'':' sys')+'"><img alt="" src="'+esc(avatarOf(a.by))+'"><div><div class="h"><b>'+esc(nameOf(a.by,a.as))+'</b>'+(a.as?' · '+esc(a.as):'')+' · '+esc(ago(a.at))+'</div><div class="x">'+esc(a.text)+'</div></div></div>').join('')+'</div></div>';

  h += '</div></aside>';
  patch(host, h);
}
function actionBox(j){
  const k=S.action; const id=j.id;
  const vOpts = S.vendors.map(v=>'<option value="'+esc(v.id)+'"'+(v.id===j.vendorId?' selected':'')+'>'+esc(v.name)+'</option>').join('');
  const box=(title,body,btn,cls)=>'<div class="actbox"><h3>'+title+'</h3>'+body+'<div id="ax-err" class="err" hidden></div><div class="actions"><button class="btn '+(cls||'primary')+'" data-act="jdo">'+btn+'</button><button class="btn ghost" data-act="jact" data-k="">Back</button></div></div>';
  switch(k){
    case 'accept': return box('Accept this cleaning', '<label class="field"><span>Your quote in USD (optional)</span><input class="input" type="number" min="0" step="0.01" id="ax-quote-'+id+'" placeholder="e.g. 1850"></label><label class="field"><span>Note to Silver Air (optional)</span><input class="input" id="ax-note-'+id+'" placeholder="e.g. Crew of 3 arriving 08:00"></label>', 'Accept job');
    case 'decline': return box('Decline this cleaning', '<label class="field"><span>Reason</span><input class="input" id="ax-note-'+id+'" placeholder="e.g. No crew available that day"></label>', 'Decline job','danger');
    case 'start': return box('Start work', '<p class="small muted" style="margin:0">Tip: add before photos first so Silver Air sees the aircraft’s condition.</p><label class="field"><span>Note (optional)</span><input class="input" id="ax-note-'+id+'" placeholder="e.g. On the aircraft at Hangar 4"></label>', 'Start work');
    case 'complete': return box('Mark complete', ((j.photos||[]).some(p=>p.kind==='after')?'':'<p class="small" style="margin:0;color:var(--s-req)">No after photos yet — add them below before completing.</p>')+'<label class="field"><span>Completion note (optional)</span><textarea class="input" id="ax-note-'+id+'" rows="2" placeholder="Anything Silver Air should know, like damage noticed or products used"></textarea></label>', 'Mark complete');
    case 'invoice': return box('Add invoice', '<div class="grid2"><label class="field"><span>Invoice number</span><input class="input" id="ax-inv-'+id+'"></label><label class="field"><span>Amount (USD)</span><input class="input" type="number" min="0" step="0.01" id="ax-amt-'+id+'" value="'+esc(j.quote||'')+'"></label></div>', 'Save invoice');
    case 'reassign': return box('Send to a vendor', '<label class="field"><span>Vendor</span><select class="input" id="ax-v-'+id+'">'+vOpts+'</select></label>', 'Send job');
    case 'cancel': return box('Cancel this cleaning', '<label class="field"><span>Reason (shared with the vendor)</span><input class="input" id="ax-note-'+id+'" placeholder="e.g. Trip moved up, aircraft departing early"></label>', 'Cancel job','danger');
    case 'reopen': return box('Reopen this job', '<p class="small muted" style="margin:0">It goes back to Requested and the vendor sees it again.</p>', 'Reopen');
  }
  return '';
}

    + '<datalist id="jf-apts">'+apts.map(a=>'<option value="'+esc(a.icao)+'">'+esc(a.fbo||'')+'</option>').join('')+'</datalist>'
    + '<div class="field"><span>Services</span><div class="checks">'+S.config.services.map((s,i)=>'<label class="check"><input type="checkbox" id="jf-s'+i+'" value="'+esc(s)+'"'+(svc.has(s)?' checked':'')+'> '+esc(s)+'</label>').join('')+'</div></div>'
    + '<label class="field"><span>Instructions for the vendor</span><textarea class="input" id="jf-notes" rows="3" placeholder="e.g. GPU available, don’t touch the cockpit, crew arrives 10:00">'+esc(j.notes||'')+'</textarea></label>'
    + '<div id="jf-err" class="err" hidden></div>'
    + '<div class="mfoot"><button type="button" class="btn ghost" data-act="modal-close">Cancel</button><button type="submit" class="btn primary">'+(edit?'Save changes':'Send to vendor')+'</button></div>'
    + '</form></div>';
  $('#modalHost').innerHTML = h;
  const f = $('#jobform');
  $('#jf-apt').addEventListener('change', e=>{ const a=apts.find(x=>x.icao===e.target.value.toUpperCase()); if(a && !$('#jf-fbo').value) $('#jf-fbo').value=a.fbo||''; });
  f.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = {
      tail: $('#jf-tail').value, vendorId: $('#jf-vendor').value,
      airport: $('#jf-apt').value.trim().toUpperCase(), fbo: $('#jf-fbo').value.trim(),
      start: $('#jf-start').value, due: $('#jf-due').value, notes: $('#jf-notes').value.trim(),
      services: [...f.querySelectorAll('.checks input:checked')].map(i=>i.value)
    };
    const err = !data.tail ? 'Pick an aircraft.' : !data.vendorId ? 'Pick a vendor.' : !data.airport ? 'Enter the airport.' : !data.start || !data.due ? 'Set both times.' : pd(data.due)<=pd(data.start) ? '“Complete by” must be after “Available from”.' : !data.services.length ? 'Pick at least one service.' : '';
    const el=$('#jf-err'); if(err){ el.textContent=err; el.hidden=false; return; }
    const btn=f.querySelector('[type=submit]'); btn.disabled=true;

      if(edit){
        const changes=[]; if(data.vendorId!==job.vendorId) changes.push('vendor → '+((vendorById(data.vendorId)||{}).name||''));

  });

    + '<h2>'+esc(v.name)+'</h2><div class="grid2">'
    + '<label class="field"><span>Company name</span><input class="input" id="vf-name" value="'+esc(v.name)+'"></label>'
    + '<label class="field"><span>Airports served (ICAO, comma separated)</span><input class="input mono" id="vf-apts" value="'+esc((v.airports||[]).join(', '))+'" placeholder="KVNY, KSMO"></label>'
    + '<label class="field"><span>Dispatch phone</span><input class="input" id="vf-phone" value="'+esc(v.phone||'')+'"></label>'
    + '<label class="field"><span>Dispatch email</span><input class="input" id="vf-email" value="'+esc(v.email||'')+'"></label></div>'
    + '<div id="vf-err" class="err" hidden></div>'
    + '<div class="mfoot"><button type="button" class="btn danger" data-act="v-del" data-id="'+esc(id)+'" style="margin-right:auto">Remove company</button><button type="button" class="btn ghost" data-act="modal-close">Cancel</button><button type="submit" class="btn primary">Save</button></div></form></div>';
  $('#vform').addEventListener('submit', async e=>{
    e.preventDefault(); const el=$('#vf-err');
    const name=$('#vf-name').value.trim(); if(!name){ el.textContent='Enter a name.'; el.hidden=false; return; }
    try{ await S.db.doc('vendors/'+id).set({name, airports:$('#vf-apts').value.split(/[,\s]+/).map(s=>s.trim().toUpperCase()).filter(Boolean), phone:$('#vf-phone').value.trim(), email:$('#vf-email').value.trim()});
      closeModal(); toast('Saved '+name); }catch(ex){ el.textContent=writeErr(ex); el.hidden=false; }
  });
}
function confirmBox(title, text, btn, fn){
  $('#modalHost').innerHTML = '<div class="scrim" data-act="modal-close"></div><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="box"><h2>'+esc(title)+'</h2><p style="margin:0">'+esc(text)+'</p><div class="mfoot"><button class="btn ghost" data-act="modal-close">Keep</button><button class="btn danger" id="cf-go">'+esc(btn)+'</button></div></div></div>';
  $('#cf-go').addEventListener('click', async ()=>{ try{ await fn(); closeModal(); }catch(ex){ toast(writeErr(ex)); } });
}

/* ---------- writes ---------- */
function writeErr(ex){
  const c = ex && ex.code;
  if(c==='invalid_argument') return 'You don’t have permission to change this. Ask Silver Air to share the app with you as “Can edit”.';
  if(c==='quota_exceeded') return 'The database is full. Ask the admin to remove old jobs.';
  if(c==='resource_exhausted') return 'Too many changes at once. Wait a moment and try again.';
  return 'Couldn’t save. Check your connection and try again.';
}
const queues = {};
function serial(key, fn){ const p=(queues[key]||Promise.resolve()).catch(()=>{}).then(fn); queues[key]=p; return p; }
function actEntry(type,text){ return {at:new Date().toISOString(), by:S.uid||null, as:orgLabel(), type, text}; }
async function createJob(data){
  const ref = S.db.collection('jobs').doc();
  const now = new Date().toISOString();
  await ref.set({...data, ref:makeRef(), status:'requested', createdAt:now, updatedAt:now, requestedBy:S.uid||null, photos:[],
    activity:[actEntry('status','Requested cleaning from '+((vendorById(data.vendorId)||{}).name||'vendor'))]});
  return ref.id;
}
function updateJob(job, patchData, text, type){
  return serial(job.id, async ()=>{
    const latest = S.jobs.find(x=>x.id===job.id) || job;
    const activity = [...(latest.activity||[]), actEntry(type||'status', text)].slice(-150);
    await S.db.doc('jobs/'+job.id).update({...patchData, updatedAt:new Date().toISOString(), activity});
  });
}
async function doJobAction(j){
  const k=S.action, id=j.id; const val = s=>{ const e=document.getElementById(s+'-'+id); return e?e.value.trim():''; };
  const err=$('#ax-err'); const fail=m=>{ err.textContent=m; err.hidden=false; };
  let p, t;
  switch(k){
    case 'accept': { const q=val('ax-quote'), n=val('ax-note'); p={status:'accepted', acceptedAt:new Date().toISOString()}; if(q) p.quote=+q; t='Accepted the job'+(q?' · quote '+money(q):'')+(n?' — '+n:''); break; }
    case 'decline': { const n=val('ax-note'); if(!n) return fail('Give a reason so Silver Air can rebook.'); p={status:'declined', declineReason:n}; t='Declined — '+n; break; }
    case 'start': { const n=val('ax-note'); p={status:'in_progress', startedAt:new Date().toISOString()}; t='Started work'+(n?' — '+n:''); break; }
    case 'complete': { const n=val('ax-note'); p={status:'completed', completedAt:new Date().toISOString()}; if(n) p.completionNote=n; t='Marked complete'+(n?' — '+n:''); break; }
    case 'invoice': { const inv=val('ax-inv'), amt=val('ax-amt'); if(!inv) return fail('Enter the invoice number.'); if(!amt) return fail('Enter the amount.'); p={status:'invoiced', invoiceNo:inv, invoiceAmount:+amt, invoicedAt:new Date().toISOString()}; t='Invoice #'+inv+' · '+money(amt); break; }
    case 'reassign': { const v=val('ax-v'); if(!v) return fail('Pick a vendor.'); p={vendorId:v, status:'requested', declineReason:''}; t='Sent to '+((vendorById(v)||{}).name||'vendor'); break; }
    case 'cancel': { const n=val('ax-note'); p={status:'cancelled'}; t='Cancelled'+(n?' — '+n:''); break; }
    case 'reopen': { p={status:'requested'}; t='Reopened'; break; }
    default: return;
  }
  try{ await updateJob(j, p, t, 'status'); S.action=null; S.fresh=true; toast(STATUS[p.status||j.status].label==='Requested'&&k==='reassign'?'Sent':'Updated'); render(); }
  catch(ex){ fail(writeErr(ex)); }
}
async function getAssets(){
  if(S.assets!==undefined) return S.assets;
  try{ S.assets = (window.claude && await window.claude.use('assets')) || null; }catch(e){ S.assets=null; }
  return S.assets;
}
function downscale(file){
  return new Promise(res=>{
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)){ res(file); return; }
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const max=1800; let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      c.toBlob(b=>res(b||file),'image/jpeg',.85); };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}
async function uploadPhotos(kind, files){
  const j = S.jobs.find(x=>x.id===S.openId); if(!j||!files.length) return;
  const assets = await getAssets(); if(!assets){ toast('Photo uploads aren’t available in this view.'); return; }
  S.uploading=true; renderDrawer();
  const added=[]; let failed=0;
  for(const f of files){
    try{ const b = await downscale(f); const type = b.type && /^image\/(png|jpeg|gif|webp)$/.test(b.type) ? b.type : null;
      if(!type){ failed++; continue; }
      const r = await assets.upload(b,{type}); added.push({id:r.id, kind, by:S.uid||null, at:new Date().toISOString()}); }
    catch(e){ failed++; }
  }
  S.uploading=false;
  if(added.length){
    try{ const latest=S.jobs.find(x=>x.id===j.id)||j; await updateJob(j, {photos:[...(latest.photos||[]), ...added]}, 'Added '+added.length+' '+kind+' photo'+(added.length>1?'s':''), 'photo'); }
    catch(ex){ toast(writeErr(ex)); }
  }
  if(failed) toast(failed+' photo'+(failed>1?'s':'')+' couldn’t upload. Use JPG or PNG under 20 MB.'); else if(added.length) toast('Photos added');
  renderDrawer();
}

/* ---------- events ---------- */
document.addEventListener('click', async e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(b.tagName==='A') e.preventDefault();
  switch(act){
    case 'view': S.view=b.dataset.v; lsSet('view',S.view); S.fresh=true; render(); window.scrollTo(0,0); break;
    case 'filter': S.filter=b.dataset.f; render(); break;
    case 'wk': { const d=+b.dataset.d; if(d===0) S.week=startOfWeek(new Date()); else { const w=new Date(S.week); w.setDate(w.getDate()+7*d); S.week=w; } render(); break; }
    case 'open': S.openId=b.dataset.id; S.action=null; S.fresh=true; renderDrawer(); S.fresh=false; break;
    case 'close': S.openId=null; S.action=null; renderDrawer(); break;
    case 'new-job': if(!S.vendors.length){ toast(S.owner?'Add a cleaning company in Settings first.':'No vendors set up yet.'); break; } openJobForm(null, b.dataset.tail); break;
    case 'modal-close': closeModal(); break;
    case 'jact': { const k=b.dataset.k;
      if(k==='delete'){ const j=S.jobs.find(x=>x.id===S.openId); if(!j) break;
        confirmBox('Delete '+(j.ref||'this job')+'?', 'This removes the job, its photos and its activity for everyone. It can’t be undone.', 'Delete job', async ()=>{
          const a = await getAssets(); await S.db.doc('jobs/'+j.id).delete();
          if(a) for(const p of (j.photos||[])){ try{ await a.delete(p.id); }catch(e){} }
          S.openId=null; S.action=null; renderDrawer(); toast('Job deleted'); });
        break; }
      if(k==='edit'){ const j=S.jobs.find(x=>x.id===S.openId); if(j) openJobForm(j); break; } S.action = (S.action===k? null : (k||null)); S.fresh=true; renderDrawer(); S.fresh=false; const f=$('.actbox input, .actbox select, .actbox textarea'); if(f) f.focus(); break; }
    case 'jdo': { const j=S.jobs.find(x=>x.id===S.openId); if(j){ b.disabled=true; await doJobAction(j); b.disabled=false; } break; }
    case 'comment': { const j=S.jobs.find(x=>x.id===S.openId); if(!j) break; const ta=document.getElementById('cm-'+j.id); const t=ta&&ta.value.trim(); if(!t) break;
      b.disabled=true; try{ await updateJob(j,{}, t, 'comment'); ta.value=''; }catch(ex){ toast(writeErr(ex)); } b.disabled=false; break; }
    case 'photo': $('#modalHost').innerHTML='<div class="scrim" data-act="modal-close"></div><div class="modal" data-act="modal-close"><div class="box wide"><img alt="Job photo" src="'+esc(b.dataset.src)+'"></div></div>'; break;
    case 'guest-pick': { const v=$('#g-vendor').value; if(!v){ toast('Pick your company.'); break; } S.guestVendor=v; lsSet('guestVendor',v); S.fresh=true; render(); break; }
    case 'viewas-exit': S.viewAs=null; lsSet('viewAs',null); S.openId=null; S.action=null; S.fresh=true; render(); break;
    case 'guest-reset': S.guestVendor=null; lsSet('guestVendor',null); S.openId=null; S.fresh=true; render(); break;
    case 'req-submit': {
      const role = $('#g-role-staff').checked ? 'staff':'vendor'; const vendorId=$('#g-vendor').value; const note=$('#g-note').value.trim();
      const el=$('#g-err'); if(role==='vendor' && !vendorId){ el.textContent='Pick your company, or ask Silver Air to add it.'; el.hidden=false; break; }
      try{ await S.db.doc('requests/'+S.uid).set({role, vendorId: role==='vendor'?vendorId:'', note, at:new Date().toISOString()}); S.myRequest={role,vendorId,note}; render(); }
      catch(ex){ el.textContent=writeErr(ex); el.hidden=false; }
      break; }
    case 'req-withdraw': try{ await S.db.doc('requests/'+S.uid).delete(); S.myRequest=null; S.fresh=true; render(); }catch(ex){ toast(writeErr(ex)); } break;
    case 'rq-approve': { const id=b.dataset.id; const role=$('#rq-role-'+CSS.escape(id)).value; const v=$('#rq-v-'+CSS.escape(id)).value;
      if(role==='vendor'&&!v){ toast('Pick their company first.'); break; }
      try{ await S.db.doc('roles/'+id).set({role, vendorId: role==='vendor'?v:'', approvedAt:new Date().toISOString()}); await S.db.doc('requests/'+id).delete(); toast('Approved '+nameOf(id,'user')); }catch(ex){ toast(writeErr(ex)); } break; }
    case 'rq-dismiss': try{ await S.db.doc('requests/'+b.dataset.id).delete(); toast('Request dismissed'); }catch(ex){ toast(writeErr(ex)); } break;
    case 'role-remove': { const id=b.dataset.id; confirmBox('Remove access?', nameOf(id,'This person')+' will no longer see any jobs. You can also remove them from the Share menu.', 'Remove access', ()=>S.db.doc('roles/'+id).delete()); break; }
    case 'v-add': { const n=$('#nv-name').value.trim(); if(!n) break; let id=slug(n); if(vendorById(id)) id+='-'+Date.now().toString(36);
      try{ await S.db.doc('vendors/'+id).set({name:n, airports:[], phone:'', email:''}); $('#nv-name').value=''; toast('Added '+n); }catch(ex){ toast(writeErr(ex)); } break; }
    case 'v-edit': openVendorForm(b.dataset.id); break;
    case 'v-del': { const id=b.dataset.id; const v=vendorById(id); const open=S.jobs.filter(j=>j.vendorId===id && ['requested','accepted','in_progress'].includes(j.status)).length;
      confirmBox('Remove '+(v?v.name:'company')+'?', open? 'They still have '+open+' open job'+(open>1?'s':'')+'. Those jobs will show “No vendor” until you reassign them.' : 'Their users lose access to the desk.', 'Remove company', ()=>S.db.doc('vendors/'+id).delete()); break; }
    case 'svc-add': { const n=$('#ns-name').value.trim(); if(!n||S.config.services.includes(n)) break; await saveConfig({services:[...S.config.services, n]}); $('#ns-name').value=''; break; }
    case 'svc-rm': { const i=+b.dataset.i; await saveConfig({services:S.config.services.filter((_,x)=>x!==i)}); break; }
    case 'apt-add': { const ic=$('#na-icao').value.trim().toUpperCase(); const fbo=$('#na-fbo').value.trim(); if(!/^[A-Z0-9]{3,4}$/.test(ic)){ toast('Enter a 3–4 character airport code.'); break; }
      await saveConfig({airports:[...S.config.airports.filter(a=>!(a.icao===ic&&a.fbo===fbo)), {icao:ic, fbo}]}); $('#na-icao').value=''; $('#na-fbo').value=''; break; }
    case 'apt-rm': { const i=+b.dataset.i; await saveConfig({airports:S.config.airports.filter((_,x)=>x!==i)}); break; }
    case 'ac-new': openAircraftForm(null); break;
    case 'ac-edit': openAircraftForm(b.dataset.tail); break;
    case 'ac-del': { const t=b.dataset.tail; confirmBox('Remove '+t+'?', 'It disappears from the fleet list. Past jobs for '+t+' stay on record.', 'Remove aircraft', ()=>S.db.doc('fleet/'+t).delete()); break; }
  }
});
async function saveConfig(p){ try{ await serial('config', ()=>S.db.doc('config/main').set({...S.config, ...p})); }catch(ex){ toast(writeErr(ex)); } }
document.addEventListener('input', e=>{ if(e.target.id==='q'){ S.q=e.target.value; render(); } });
document.addEventListener('change', e=>{ if(e.target.id==='viewas'){ S.viewAs=e.target.value||null; lsSet('viewAs',S.viewAs); S.openId=null; S.action=null; S.filter='active'; S.fresh=true; render(); window.scrollTo(0,0); if(S.viewAs) toast('Now previewing as '+orgLabel()); return; } const k=e.target.dataset && e.target.dataset.upload; if(k){ const files=[...e.target.files]; e.target.value=''; uploadPhotos(k, files); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('#modalHost').innerHTML) closeModal(); else if(S.openId){ S.openId=null; S.action=null; renderDrawer(); } } });

/* ---------- boot ---------- */
(async function boot(){
  if(!window.claude || !window.claude.use){ S.noDb=true; render(); return; }
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if(!db){ S.noDb=true; render(); return; }
  S.db=db; S.user=user;
  if(user){
    const [id, owner, cw] = await Promise.all([user.id(), user.isOwner(), user.can('data.write')]);
    S.uid=id; S.owner=owner; S.canWrite=cw; S.readOnly = cw===false;
  }
  const loaded = {fleet:0,vendors:0,config:0,jobs:0,roles:0};
  const check = ()=>{ if(!S.ready && Object.values(loaded).every(Boolean)){ S.ready=true; } render(); };
  const onErr = e=>{ if(e && e.code==='revoked'){ S.ready=false; S.noDb=true; render(); } };
  db.collection('fleet').onSnapshot(s=>{ S.fleet=s.docs.map(d=>({id:d.id,...d.data()})); loaded.fleet=1; check(); }, onErr);
  db.collection('vendors').onSnapshot(s=>{ S.vendors=s.docs.map(d=>({id:d.id,...d.data()})); loaded.vendors=1; check(); }, onErr);
  db.doc('config/main').onSnapshot(s=>{ const d=s.exists?s.data():{}; S.config={services:d.services||[], airports:d.airports||[]}; loaded.config=1; check(); }, onErr);
  db.collection('jobs').onSnapshot(s=>{ S.jobs=s.docs.map(d=>({id:d.id,...d.data()})); loaded.jobs=1; check(); }, onErr);
  db.collection('tracking').onSnapshot(s=>{ const t={}; s.docs.forEach(d=>t[d.id]=d.data()); S.tracking=t; render(); }, ()=>{});
  db.collection('roles').onSnapshot(s=>{ const r={}; s.docs.forEach(d=>r[d.id]=d.data()); S.roles=r; loaded.roles=1; check(); }, onErr);
  if(S.owner) db.collection('requests').onSnapshot(s=>{ S.requests=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, onErr);
  else if(S.uid) db.doc('requests/'+S.uid).onSnapshot(s=>{ S.myRequest = s.exists? s.data() : null; render(); }, ()=>{});
  getAssets().then(()=>{ if(S.openId) renderDrawer(); });
  setTimeout(()=>{ if(!S.ready){ S.ready=true; render(); } }, 8000);
})();
render();
})();
</script>
